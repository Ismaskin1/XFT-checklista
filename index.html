<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Checklistan har flyttat · XFT</title>
  <meta http-equiv="refresh" content="3; url=https://checklista.xft.se/filmare">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; min-height: 100%; background: #111a24; color: #ffffff; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 28rem; margin: 0 auto; padding: 4rem 1.5rem; line-height: 1.5; }
    .eyebrow { font-size: .7rem; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: #35e375; }
    h1 { font-size: 1.75rem; margin: .5rem 0 1rem; }
    p { color: #8fa0b4; margin: 0 0 1rem; }
    a.cta { display: inline-block; margin-top: 1rem; padding: .85rem 1.5rem; border-radius: 999px; background: #35e375; color: #0c131c; font-weight: 700; text-decoration: none; }
    small { display: block; margin-top: 2rem; color: #5f6f83; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">XFT Filmteam</p>
    <h1>Utrustningschecklistan har flyttat</h1>
    <p>Den finns nu på checklista.xft.se, kopplad till varje filmdag. Du skickas dit om några sekunder.</p>
    <a class="cta" href="https://checklista.xft.se/filmare">Öppna den nya checklistan</a>
    <small>Har du en gammal genväg på hemskärmen? Ta bort den och lägg till checklista.xft.se i stället.</small>
  </main>
  <script>
    // The old app kept its offline copy through a service worker. It is
    // removed here so the phone stops showing the old checklist.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (list) {
        list.forEach(function (registration) { registration.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (keys) { keys.forEach(function (key) { caches.delete(key); }); });
    }
    setTimeout(function () { location.replace('https://checklista.xft.se/filmare'); }, 3000);
  </script>
</body>
</html>
