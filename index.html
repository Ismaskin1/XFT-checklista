<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XFT Checklista">
<title>XFT Utrustningschecklista</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0c; --surface: #141416; --raise: #1c1c1f;
    --line: rgba(255,255,255,0.07); --line2: rgba(255,255,255,0.13);
    --text: #f5f5f6; --muted: #8e8e96; --faint: #63636b;
    --accent: #35e375; --accent-dim: rgba(53,227,117,0.12);
    --danger: #ff5a5a; --danger-dim: rgba(255,90,90,0.12);
    --warn: #f5b83d; --warn-dim: rgba(245,184,61,0.12);
    --r: 12px; --r-lg: 16px; --nav-h: 62px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  button, input, textarea { font-family: inherit; }

  /* ── Startskärmens varumärkesblock: enda platsen där neonloggan visas ── */
  .brand { padding: 2rem 1.25rem 1.5rem; display: flex; flex-direction: column; align-items: center; }
  .brand-mark { width: clamp(180px, 52vw, 260px); opacity: 0; animation: fadeIn 0.9s ease forwards; filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px rgba(255,255,255,0.55)) drop-shadow(0 0 18px rgba(255,255,255,0.18)); }
  .brand-mark svg { display: block; width: 100%; fill: #fff; }
  .brand-rule { width: 0; height: 1px; margin: 14px 0 10px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), var(--accent), rgba(255,255,255,.35), transparent); animation: rule .7s ease .9s forwards; }
  .brand-sub { font-family: 'Exo 2', -apple-system, sans-serif; font-size: 12px; font-weight: 300; letter-spacing: .2em; opacity: 0; animation: fadeIn .7s ease 1.2s forwards; }
  .brand-sub .w { color: #fff; }
  .brand-sub .g { color: var(--accent); }
  .brand-sub .s { color: rgba(255,255,255,.22); margin: 0 9px; }
  .brand-ver { font-size: 11px; color: var(--faint); margin-top: 12px; opacity: 0; animation: fadeIn .7s ease 1.4s forwards; }
  @keyframes fadeIn { to { opacity: 1 } }
  @keyframes rule { to { width: 190px } }

  /* ── Slimmat sidhuvud när ett uppdrag pågår ── */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 20px 0; }
  .topbar .mini { width: 42px; flex-shrink: 0; opacity: .9; }
  .topbar .mini svg { display: block; width: 100%; fill: #fff; }
  .topbar .spacer { flex: 1; }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; padding: 4px 0; }
  .link-btn.quiet { color: var(--muted); }

  .main { max-width: 600px; margin: 0 auto; padding-bottom: calc(var(--nav-h) + var(--actions-h, 0px) + 1.5rem); }
  .phase-panel { display: none; }
  .phase-panel.active { display: block; }

  .page-head { padding: 12px 20px 0; }
  .page-head h1 { font-size: 28px; font-weight: 700; letter-spacing: -.022em; line-height: 1.12; }
  .page-sub { color: var(--muted); font-size: 14px; margin-top: 5px; line-height: 1.45; }

  /* ── Klibbig mätarrad: visar hur långt man kommit även när titeln scrollat bort ── */
  .meterbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: 16px; }
  .meter { height: 2px; margin: 0 20px; background: rgba(255,255,255,.09); border-radius: 2px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .25s ease; }
  .meter-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 20px 10px; font-size: 12.5px; color: var(--muted); }
  .meter-row b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
  .meter-row .done { color: var(--accent); }

  /* ── Formulär ── */
  .form { padding: 4px 20px 0; }
  .field { margin-top: 18px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); font-weight: 550; margin-bottom: 7px; }
  .field input { width: 100%; background: var(--surface); border: 1px solid var(--line2); border-radius: var(--r); padding: 13px 14px; color: var(--text); font-size: 16px; outline: none; -webkit-appearance: none; }
  .field input:focus { border-color: var(--accent); }

  /* ── Sektioner och rader, inga kort ── */
  .sec { display: flex; align-items: center; gap: 13px; padding: 0 20px; height: 46px; margin-top: 14px; cursor: pointer; user-select: none; }
  .sec .nm { flex: 1; font-size: 14px; font-weight: 650; letter-spacing: -.005em; }
  .sec .ct { color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .sec .cv { color: var(--faint); font-size: 10px; }
  .sec.plain { cursor: default; }
  .sec.alert .nm, .sec.alert .ct { color: var(--danger); }

  .row { display: flex; align-items: center; gap: 13px; padding: 0 20px; min-height: 50px; border-top: 1px solid var(--line); cursor: pointer; user-select: none; }
  .row:active { background: var(--surface); }
  .row .nm { flex: 1; font-size: 15.5px; letter-spacing: -.01em; line-height: 1.3; padding: 8px 0; }
  .row.dim .nm { color: var(--faint); }
  .row.static { cursor: default; }
  .row.static:active { background: none; }
  .cv { color: var(--faint); font-size: 13px; flex-shrink: 0; }

  .box { width: 21px; height: 21px; border-radius: 6px; border: 1.5px solid var(--line2); flex-shrink: 0; position: relative; transition: background .12s, border-color .12s; }
  .box.on { background: var(--accent); border-color: var(--accent); }
  .box.on::after { content: ""; position: absolute; left: 6px; top: 3px; width: 6px; height: 10px; border: solid #08120c; border-width: 0 2px 2px 0; transform: rotate(42deg); }
  .box.half { background: var(--accent); border-color: var(--accent); }
  .box.half::after { content: ""; position: absolute; left: 4px; top: 8.5px; width: 11px; height: 2px; background: #08120c; border-radius: 1px; }

  .st { font-size: 13px; flex-shrink: 0; font-weight: 550; }
  .st.ok { color: var(--accent); }
  .st.slitage { color: var(--warn); }
  .st.skadad { color: var(--danger); }
  .st.saknas { color: var(--danger); }
  .st.none { color: var(--faint); font-weight: 500; }
  .cmt { padding: 0 20px 11px 20px; margin-top: -6px; font-size: 12.5px; color: var(--faint); line-height: 1.45; }
  .hint { padding: 10px 20px 0; font-size: 12.5px; color: var(--faint); line-height: 1.5; }

  /* ── Gels ── */
  .gels { padding: 12px 20px 4px; border-top: 1px solid var(--line); }
  .gels-l { font-size: 12.5px; color: var(--muted); margin-bottom: 9px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 20px; border: 1px solid var(--line2); color: var(--muted); font-size: 13px; font-weight: 550; cursor: pointer; user-select: none; }
  .chip.on { border-color: rgba(53,227,117,.5); background: var(--accent-dim); color: var(--text); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  /* ── Segmenterat val (BTS) ── */
  .seg { display: flex; gap: 8px; padding: 0 20px; margin-top: 12px; }
  .seg button { flex: 1; height: 44px; border-radius: var(--r); border: 1px solid var(--line2); background: transparent; color: var(--muted); font-size: 14.5px; font-weight: 600; cursor: pointer; }
  .seg button.on-ok { border-color: rgba(53,227,117,.5); background: var(--accent-dim); color: var(--accent); }
  .seg button.on-no { border-color: rgba(255,90,90,.5); background: var(--danger-dim); color: var(--danger); }
  .ta { width: calc(100% - 40px); margin: 12px 20px 0; background: var(--surface); border: 1px solid var(--line2); border-radius: var(--r); padding: 12px 14px; color: var(--text); font-size: 15px; resize: none; outline: none; -webkit-appearance: none; font-family: inherit; }
  .ta:focus { border-color: var(--accent); }

  .filename { margin: 10px 20px 0; background: var(--surface); border-radius: var(--r); padding: 12px 14px; font-size: 13px; color: var(--muted); line-height: 1.5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .filename b { color: var(--text); font-weight: 600; }
  .mini-btn { border: 1px solid var(--line2); background: transparent; color: var(--muted); border-radius: 8px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; }

  .reset-btn { display: block; width: calc(100% - 40px); margin: 28px 20px 8px; background: none; border: none; color: var(--faint); font-size: 13px; cursor: pointer; padding: 10px; }
  .reset-btn:active { color: var(--danger); }

  /* ── Fast bottenyta: en primär handling ── */
  .phase-actions { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index: 40; max-width: 600px; margin: 0 auto; padding: 20px 20px 12px; background: linear-gradient(to bottom, rgba(11,11,12,0) 0%, var(--bg) 26%); }
  .cta { width: 100%; height: 52px; border-radius: 14px; border: none; background: var(--accent); color: #08120c; font-size: 16px; font-weight: 650; letter-spacing: -.01em; cursor: pointer; }
  .cta:active { opacity: .85; }

  /* ── Stegindikator: flödet är linjärt, så navigeringen visar var man är ── */
  .steps { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding: 0 12px env(safe-area-inset-bottom); background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: 6px; }
  .step { flex: 1; background: none; border: none; padding: 12px 4px 0; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
  .step .bar { height: 2px; border-radius: 2px; background: rgba(255,255,255,.09); }
  .step .lbl { font-size: 11.5px; font-weight: 600; color: var(--faint); letter-spacing: .005em; }
  .step.done .bar { background: rgba(53,227,117,.45); }
  .step.done .lbl { color: var(--muted); }
  .step.active .bar { background: var(--accent); }
  .step.active .lbl { color: var(--text); }

  /* ── Ark som glider upp underifrån ── */
  .sheet-wrap { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,.6); align-items: flex-end; justify-content: center; }
  .sheet-wrap.open { display: flex; }
  .sheet { background: var(--surface); border-top: 1px solid var(--line2); border-radius: 20px 20px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom)); width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); margin: 0 auto 18px; }
  .sheet h3 { font-size: 19px; font-weight: 650; letter-spacing: -.015em; line-height: 1.25; }
  .sheet .who { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
  .sheet .body { color: var(--muted); font-size: 14.5px; line-height: 1.55; margin-top: 10px; }
  .sheet .ta { width: 100%; margin: 14px 0 0; }
  .opt { display: flex; align-items: center; gap: 13px; min-height: 54px; border-top: 1px solid var(--line); font-size: 15.5px; cursor: pointer; user-select: none; }
  .opt .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .opt .tick { margin-left: auto; color: var(--accent); font-size: 15px; opacity: 0; }
  .opt.sel .tick { opacity: 1; }
  .sheet-list { list-style: none; margin: 12px 0 4px; max-height: 34vh; overflow-y: auto; }
  .sheet-list li { padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
  .sheet .cta { margin-top: 18px; }
  .sheet .cta.danger { background: var(--danger); color: #1a0505; }
  .btn-quiet { width: 100%; height: 48px; margin-top: 8px; border-radius: 14px; border: none; background: transparent; color: var(--muted); font-size: 15px; font-weight: 550; cursor: pointer; }

  /* ── Heltäckande lägen ── */
  .send-overlay { display: none; position: fixed; inset: 0; z-index: 400; background: var(--bg); overflow-y: auto; }
  .send-overlay.open { display: block; }
  .screen { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding: 4rem 1.5rem 3rem; max-width: 460px; margin: 0 auto; }
  .screen .ring { width: 66px; height: 66px; border-radius: 50%; border: 1.5px solid rgba(53,227,117,.4); background: var(--accent-dim); display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--accent); }
  .screen .ring.bad { border-color: rgba(255,90,90,.45); background: var(--danger-dim); color: var(--danger); }
  .screen .ring.wait { border-color: var(--line2); background: none; color: var(--muted); }
  .screen h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .screen h2.bad { color: var(--danger); }
  .screen p { color: var(--muted); font-size: 14.5px; line-height: 1.6; }
  .screen .cta, .screen .btn-quiet { max-width: 300px; }
  .screen .cta { margin-top: 10px; }
  .detail { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 15px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.55; color: var(--text); text-align: left; overflow-wrap: anywhere; }
  .detail span { display: block; font-family: inherit; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin-bottom: 7px; font-family: -apple-system, sans-serif; }

  .toast { position: fixed; bottom: calc(var(--nav-h) + var(--actions-h, 0px) + 16px); left: 50%; transform: translateX(-50%) translateY(140px); background: var(--raise); border: 1px solid var(--line2); color: var(--text); padding: 13px 20px; border-radius: var(--r); font-size: 14.5px; font-weight: 550; line-height: 1.4; transition: transform .28s ease, visibility .28s; z-index: 999; box-shadow: 0 8px 28px rgba(0,0,0,.55); max-width: 88vw; text-align: center; pointer-events: none; visibility: hidden; }
  .toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }
  .toast.err { border-color: rgba(255,90,90,.5); color: var(--danger); }

  .note { padding: 1.25rem 20px; color: var(--muted); font-size: 14.5px; line-height: 1.55; }
</style>
</head>

    <div class="brand-ver">Utrustningschecklista v4.1</div>

  <div id="topbar" class="topbar" style="display:none">

    <div class="spacer"></div>
    <button class="link-btn" id="topbar-action" style="display:none"></button>
  </div>

  <div class="phase-panel active" id="panel-utresa">
    <div class="page-head">
      <h1>Utresa</h1>
      <p class="page-sub" id="utresa-sub"></p>
    </div>
    <div class="form" id="session-form">
      <div class="field">
        <label>Ditt namn</label>
        <input type="text" id="filmer-name" placeholder="t.ex. Petrus" autocomplete="name">
      </div>
      <div class="field">
        <label>Kundnamn</label>
        <input type="text" id="customer-name" placeholder="t.ex. Björk &amp; Partners AB" autocomplete="off">
      </div>
      <div class="field">
        <label>Datum</label>
        <input type="date" id="trip-date">
      </div>
    </div>
    <div class="meterbar">
      <div class="meter"><i id="utresa-meter"></i></div>
      <div class="meter-row">
        <span id="utresa-status"></span>
        <button class="link-btn" id="utresa-selectall" onclick="selectAllUtresa()">Välj alla</button>
      </div>
    </div>
    <div id="checklist-utresa"></div>
    <button class="reset-btn" onclick="askReset()">Rensa allt och börja om</button>
    <div class="phase-actions" id="utresa-actions">
      <button class="cta" onclick="lockUtresa()">Lås utresa</button>
    </div>
  </div>

  <div class="phase-panel" id="panel-hemresa">
    <div class="page-head">
      <h1>Hemresa</h1>
      <p class="page-sub" id="hemresa-sub"></p>
    </div>
    <div class="meterbar" id="hemresa-meterbar">
      <div class="meter"><i id="hemresa-meter"></i></div>
      <div class="meter-row">
        <span id="hemresa-status"></span>
        <button class="link-btn" id="hemresa-selectall" onclick="selectAllHemresa()">Bocka av alla</button>
      </div>
    </div>
    <div id="checklist-hemresa"></div>
    <div class="phase-actions" id="hemresa-actions">
      <button class="cta" onclick="lockHemresa()">Bekräfta hemresa</button>
    </div>
  </div>

  <div class="phase-panel" id="panel-kontor">
    <div class="page-head">
      <h1>Kontroll</h1>
      <p class="page-sub" id="kontor-sub"></p>
    </div>
    <div class="meterbar" id="kontor-meterbar">
      <div class="meter"><i id="kontor-meter"></i></div>
      <div class="meter-row">
        <span id="kontor-status"></span>
        <button class="link-btn" id="rest-ok-btn" onclick="askRestOk()">Resten är OK</button>
      </div>
    </div>
    <div id="wear-checks"></div>
    <div class="phase-actions" id="kontor-actions">
      <button class="cta" onclick="submitKontor()">Lämna in rapporten</button>

const STORE_KEY = 'xft_v2';

// Allt loggas i kalkylarket; adminvyn är där kontoret följer utrustningen.
// Webbappens URL slutar på /exec.
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzU1sBwwopFYQL-eMmswqz0fGrFHP42OOqXDDqM2pV8Q9FqScuqWkSEMPZybKn3T0gRow/exec';

  { name:"Lila",   display:"Lila",   color:"#a035e0" },
];
const STATUS_TEXT = { ok:'OK', slitage:'Slitage', skadad:'Skadad' };

function freshState() {
  return { utresa:{locked:false,filmer:'',customer:'',date:'',taken:[]}, hemresa:{locked:false,returned:[]}, kontor:{wear:{}}, openGroups:{}, gels:[], btsShown:false };
}
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e) {}
  const f = freshState();
  if (!s || typeof s !== 'object') return f;
  s.utresa = Object.assign(f.utresa, s.utresa);
  s.hemresa = Object.assign(f.hemresa, s.hemresa);
  s.kontor = Object.assign(f.kontor, s.kontor);
  if (!Array.isArray(s.utresa.taken)) s.utresa.taken = [];
  if (!Array.isArray(s.hemresa.returned)) s.hemresa.returned = [];
  if (!s.kontor.wear || typeof s.kontor.wear !== 'object') s.kontor.wear = {};
  if (!s.openGroups || typeof s.openGroups !== 'object') s.openGroups = {};
  if (!Array.isArray(s.gels)) s.gels = [];
  return s;
}
function save(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function itemName(item) { return ITEM_NAMES[item.id] || item.name; }
function groupDisplay(g) { return DISPLAY_NAMES[g] || g; }
function serialSuffix(item) { return item.serial ? ' (SN: ' + item.serial + ')' : ''; }
function takenItems(s) { return EQUIPMENT.filter(e => s.utresa.taken.includes(e.id)); }
function returnedItems(s) { return EQUIPMENT.filter(e => s.utresa.taken.includes(e.id) && s.hemresa.returned.includes(e.id)); }
function missingItems(s) { return EQUIPMENT.filter(e => s.utresa.taken.includes(e.id) && !s.hemresa.returned.includes(e.id)); }
function kortDatum(d) {
  const m = ['jan','feb','mars','april','maj','juni','juli','aug','sep','okt','nov','dec'];
  const p = String(d || '').split('-');
  return p.length === 3 ? (parseInt(p[2], 10) + ' ' + m[parseInt(p[1], 10) - 1]) : (d || '');
}

function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' err' : '');
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), isError ? 3500 : 2400);
}

// Generisk bekräftelsedialog
let confirmFn = null;
function openConfirm(title, bodyHtml, btnLabel, style, fn) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-body').innerHTML = bodyHtml;
  const btn = document.getElementById('confirm-btn');
  btn.textContent = btnLabel;
  btn.className = 'cta' + (style === 'accent' ? '' : ' danger');
  confirmFn = fn;
  document.getElementById('confirm-modal').classList.add('open');
}
function runConfirm() { const fn = confirmFn; closeConfirm(); if (fn) fn(); }
function closeConfirm() { confirmFn = null; document.getElementById('confirm-modal').classList.remove('open'); }

function showOverlay(html) { const o = document.getElementById('send-overlay'); o.innerHTML = html; o.classList.add('open'); }
function closeOverlay() { document.getElementById('send-overlay').classList.remove('open'); }

// Reserverar plats nederst för den fasta knappraden, så att sista listraden och
// toast-rutan aldrig hamnar bakom den.
function syncActionBar() {
  const bar = document.querySelector('.phase-panel.active .phase-actions');
  const synlig = bar && getComputedStyle(bar).display !== 'none';
  document.documentElement.style.setProperty('--actions-h', (synlig ? bar.offsetHeight : 0) + 'px');
}

function setMeter(id, klara, totalt, ord) {
  document.getElementById(id + '-meter').style.width = (totalt ? Math.round(klara / totalt * 100) : 0) + '%';
  const el = document.getElementById(id + '-status');
  if (!totalt) { el.textContent = ''; return; }
  el.innerHTML = klara === totalt
    ? '<span class="done"><b>' + totalt + '</b> av ' + totalt + ' ' + ord + '</span>'
    : '<b>' + klara + '</b> av ' + totalt + ' ' + ord;
}

function switchTab(tab) {
  document.querySelectorAll('.phase-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.step').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  window.scrollTo(0, 0);
  render();
}

function groups(items) {
  const g = {};
  items.forEach(i => { if (!g[i.group]) g[i.group] = []; g[i.group].push(i); });
  return g;
}

function render() {
  const s = load();
  // Varumärkesblocket hör till startskärmen; pågår ett uppdrag räcker en slimmad rad
  document.getElementById('brand').style.display = s.utresa.locked ? 'none' : 'flex';
  document.getElementById('topbar').style.display = s.utresa.locked ? 'flex' : 'none';
  const action = document.getElementById('topbar-action');
  const aktiv = document.querySelector('.phase-panel.active');
  const tab = aktiv ? aktiv.id.replace('panel-', '') : 'utresa';
  if (s.utresa.locked && tab === 'utresa') {
    action.style.display = 'block'; action.textContent = 'Ändra'; action.onclick = unlockUtresa;
  } else if (s.hemresa.locked && tab === 'hemresa') {
    action.style.display = 'block'; action.textContent = 'Ändra'; action.onclick = unlockHemresa;
  } else {
    action.style.display = 'none';
  }
  document.getElementById('tab-utresa').classList.toggle('done', s.utresa.locked);
  document.getElementById('tab-hemresa').classList.toggle('done', s.hemresa.locked);
  renderUtresa(); renderHemresa(); renderKontor();
}

function renderUtresa() {
  const s = load();
  const laast = s.utresa.locked;
  document.getElementById('session-form').style.display = laast ? 'none' : 'block';
  document.getElementById('utresa-actions').style.display = laast ? 'none' : 'block';
  document.getElementById('utresa-selectall').style.display = laast ? 'none' : 'block';
  document.getElementById('utresa-sub').textContent = laast
    ? s.utresa.customer + ' · ' + kortDatum(s.utresa.date) + ' · ' + s.utresa.filmer
    : 'Fyll i uppdraget och bocka i vad du tar med.';
  if (!laast) {
    if (s.utresa.date) document.getElementById('trip-date').value = s.utresa.date;
    if (s.utresa.filmer) document.getElementById('filmer-name').value = s.utresa.filmer;
    if (s.utresa.customer) document.getElementById('customer-name').value = s.utresa.customer;
  }
  const taken = s.utresa.taken;
  setMeter('utresa', taken.length, EQUIPMENT.length, 'valda');

  let html = '';
  Object.entries(groups(EQUIPMENT)).forEach(function([gname, items]) {
    const checked = items.filter(i => taken.includes(i.id)).length;
    const all = checked === items.length, some = checked > 0 && !all;
    const open = s.openGroups[gname] !== false;
    const genc = encodeURIComponent(gname);
    html += '<div class="sec" data-group="' + genc + '" data-type="utresa-open">';
    html += '<div class="box ' + (all ? 'on' : some ? 'half' : '') + '" data-group="' + genc + '" data-type="utresa-all"></div>';
    html += '<span class="nm">' + groupDisplay(gname) + '</span>';
    html += '<span class="group-count ct">' + checked + '/' + items.length + '</span>';
    html += '<span class="cv">' + (open ? '▲' : '▼') + '</span></div>';
    if (open) {
      items.forEach(function(item) {
        const c = taken.includes(item.id);
        html += '<div class="row item-row' + (laast && !c ? ' dim' : '') + '" data-id="' + item.id + '" data-type="utresa-item">';
        html += '<div class="box ' + (c ? 'on' : '') + '"></div>';
        html += '<span class="nm">' + itemName(item) + '</span></div>';
      });
      if (gname === 'Ljus') {
        html += '<div class="gels"><div class="gels-l">Gels</div><div class="chips">';
        GELS.forEach(function(gel) {
          html += '<div class="chip' + (s.gels.includes(gel.name) ? ' on' : '') + '" data-gel="' + gel.name + '" data-type="gel-chip">';
          html += '<span class="dot" style="background:' + gel.color + '"></span>' + gel.display + '</div>';
        });
        html += '</div></div>';
      }
    }
  });
  document.getElementById('checklist-utresa').innerHTML = html;
  document.querySelectorAll('[data-type="utresa-open"]').forEach(el => el.addEventListener('click', function(e) { if (!e.target.closest('[data-type="utresa-all"]')) toggleGroupOpen(decodeURIComponent(this.dataset.group)); }));
  document.querySelectorAll('[data-type="utresa-all"]').forEach(el => el.addEventListener('click', function(e) { e.stopPropagation(); toggleGroupAll(decodeURIComponent(this.dataset.group)); }));
  document.querySelectorAll('[data-type="utresa-item"]').forEach(el => el.addEventListener('click', function() { toggleItem(parseInt(this.dataset.id)); }));
  document.querySelectorAll('[data-type="gel-chip"]').forEach(el => el.addEventListener('click', function() { toggleGel(this.dataset.gel); }));
  syncActionBar();
}

function renderHemresa() {
  const s = load();
  const actions = document.getElementById('hemresa-actions');
  const meterbar = document.getElementById('hemresa-meterbar');
  if (!s.utresa.locked) {
    document.getElementById('hemresa-sub').textContent = 'Lås utresan först.';
    document.getElementById('checklist-hemresa').innerHTML = '';
    actions.style.display = 'none';
    meterbar.style.display = 'none';
    syncActionBar();
    return;
  }
  const laast = s.hemresa.locked;
  meterbar.style.display = 'block';
  actions.style.display = laast ? 'none' : 'block';
  document.getElementById('hemresa-selectall').style.display = laast ? 'none' : 'block';

  const tItems = takenItems(s);
  const ret = s.hemresa.returned;
  const saknas = tItems.length - ret.length;
  document.getElementById('hemresa-sub').textContent = laast
    ? 'Bekräftad · ' + ret.length + ' tillbaka' + (saknas ? ', ' + saknas + ' saknas' : '')
    : 'Bocka av det du har med dig hem.';
  setMeter('hemresa', ret.length, tItems.length, 'avbockade');

  const bts = s.hemresa.bts || { status:null, reason:'' };
  let html = '<div class="sec plain"><span class="nm">BTS-content</span></div>';
  if (!laast) {
    html += '<div class="seg">';
    html += '<button data-bts="ja" class="' + (bts.status === 'ja' ? 'on-ok' : '') + '">Filmad</button>';
    html += '<button data-bts="nej" class="' + (bts.status === 'nej' ? 'on-no' : '') + '">Ej filmad</button>';
    html += '</div>';
    if (bts.status === 'nej') html += '<textarea id="bts-reason" class="ta" rows="2" placeholder="Varför filmades inte BTS?">' + esc(bts.reason || '') + '</textarea>';
  } else {
    html += '<div class="row static"><span class="nm">' + (bts.status === 'ja' ? 'Filmad' : 'Ej filmad' + (bts.reason ? ' — ' + esc(bts.reason) : '')) + '</span>';
    html += '<span class="st ' + (bts.status === 'ja' ? 'ok' : 'skadad') + '">' + (bts.status === 'ja' ? 'OK' : 'Nej') + '</span></div>';
  }

  Object.entries(groups(tItems)).forEach(function([gname, items]) {
    const checked = items.filter(i => ret.includes(i.id)).length;
    const all = checked === items.length, some = checked > 0 && !all;
    const open = s.openGroups['h_' + gname] !== false;
    const genc = encodeURIComponent(gname);
    html += '<div class="sec" data-group="' + genc + '" data-type="hem-open">';
    html += '<div class="box ' + (all ? 'on' : some ? 'half' : '') + '" data-group="' + genc + '" data-type="hem-all"></div>';
    html += '<span class="nm">' + groupDisplay(gname) + '</span>';
    html += '<span class="group-count ct">' + checked + '/' + items.length + '</span>';
    html += '<span class="cv">' + (open ? '▲' : '▼') + '</span></div>';
    if (open) {
      items.forEach(function(item) {
        const c = ret.includes(item.id);
        html += '<div class="row item-row" data-id="' + item.id + '" data-type="hem-item">';
        html += '<div class="box ' + (c ? 'on' : '') + '"></div>';
        html += '<span class="nm">' + itemName(item) + '</span>';
        if (laast && !c) html += '<span class="st saknas">Saknas</span>';
        html += '</div>';
      });
    }
  });
  document.getElementById('checklist-hemresa').innerHTML = html;
  document.querySelectorAll('[data-type="hem-open"]').forEach(el => el.addEventListener('click', function(e) { if (!e.target.closest('[data-type="hem-all"]')) toggleHemGroupOpen(decodeURIComponent(this.dataset.group)); }));
  document.querySelectorAll('[data-type="hem-all"]').forEach(el => el.addEventListener('click', function(e) { e.stopPropagation(); toggleHemGroupAll(decodeURIComponent(this.dataset.group)); }));
  document.querySelectorAll('[data-type="hem-item"]').forEach(el => el.addEventListener('click', function() { toggleHemItem(parseInt(this.dataset.id)); }));
  document.querySelectorAll('[data-bts]').forEach(btn => btn.addEventListener('click', function() { setBts(this.dataset.bts); }));
  const btsReasonEl = document.getElementById('bts-reason');
  if (btsReasonEl) btsReasonEl.addEventListener('input', function() { const s2 = load(); s2.hemresa.bts = s2.hemresa.bts || { status:'nej', reason:'' }; s2.hemresa.bts.reason = this.value; save(s2); });
  syncActionBar();
}

function setBts(status) {
  const s = load();
  if (s.hemresa.locked) return;
  if (!s.hemresa.bts) s.hemresa.bts = { status:null, reason:'' };
  s.hemresa.bts.status = status;
  if (status === 'ja') s.hemresa.bts.reason = '';
  save(s); renderHemresa();
}

function renderKontor() {
  const s = load();
  const wearDiv = document.getElementById('wear-checks');
  const actions = document.getElementById('kontor-actions');
  const meterbar = document.getElementById('kontor-meterbar');
  if (!s.utresa.locked || !s.hemresa.locked) {
    document.getElementById('kontor-sub').textContent = !s.utresa.locked ? 'Lås utresan först.' : 'Bekräfta hemresan först.';
    wearDiv.innerHTML = '';
    actions.style.display = 'none';
    meterbar.style.display = 'none';
    syncActionBar();
    return;
  }
  meterbar.style.display = 'block';
  actions.style.display = 'block';
  const returned = returnedItems(s);
  const missing = missingItems(s);
  const bts = s.hemresa.bts || {};
  const done = returned.filter(e => s.kontor.wear[e.id] && s.kontor.wear[e.id].status).length;
  const rest = returned.length - done;

  document.getElementById('kontor-sub').textContent = returned.length + ' saker tillbaka' + (missing.length ? ' · ' + missing.length + ' saknas' : '');
  setMeter('kontor', done, returned.length, 'kontrollerade');
  document.getElementById('rest-ok-btn').style.display = rest > 0 ? 'block' : 'none';

  let html = '';
  if (bts.status === 'ja') {
    html += '<div class="sec plain"><span class="nm">BTS-content</span></div>';
    html += '<div class="row" data-type="bts-drive">';
    html += '<div class="box ' + (s.kontor.btsDrive ? 'on' : '') + '"></div>';
    html += '<span class="nm">Överförd till Google Drive</span></div>';
    if (s.kontor.btsDrive) {
      html += '<div class="filename">Filnamn: <b>' + esc(s.utresa.date + ' - ' + s.utresa.customer) + '</b>';
      html += '<button class="mini-btn" onclick="copyBtsName()">Kopiera</button></div>';
    }
  }
  if (missing.length) {
    html += '<div class="sec plain alert"><span class="nm">Saknas vid hemkomst</span><span class="ct">' + missing.length + '</span></div>';
    missing.forEach(function(item) {
      html += '<div class="row static"><span class="nm">' + itemName(item) + '</span><span class="st saknas">Saknas</span></div>';
    });
    html += '<div class="hint">Kommit hem ändå? Bocka av det under Hemresa.</div>';
  }
  Object.entries(groups(returned)).forEach(function([gname, items]) {
    html += '<div class="sec plain"><span class="nm">' + groupDisplay(gname) + '</span><span class="ct">' + items.length + '</span></div>';
    items.forEach(function(item) {
      const w = s.kontor.wear[item.id] || { status:null, comment:'' };
      html += '<div class="row" id="wi-' + item.id + '" data-id="' + item.id + '" data-type="wear-row">';
      html += '<span class="nm">' + itemName(item) + '</span>';
      html += '<span class="st ' + (w.status || 'none') + '">' + (w.status ? STATUS_TEXT[w.status] : 'Ej kontrollerad') + '</span>';
      html += '<span class="cv">›</span></div>';
      if (w.status && w.status !== 'ok' && w.comment) html += '<div class="cmt">' + esc(w.comment) + '</div>';
    });
  });
  wearDiv.innerHTML = html;
  document.querySelectorAll('[data-type="wear-row"]').forEach(el => el.addEventListener('click', function() { openStatusSheet(parseInt(this.dataset.id)); }));
  const btsDriveRow = document.querySelector('[data-type="bts-drive"]');
  if (btsDriveRow) btsDriveRow.addEventListener('click', function() { const s2 = load(); s2.kontor.btsDrive = !s2.kontor.btsDrive; save(s2); renderKontor(); });
  syncActionBar();
}

// ── Arket där en sak får sin status ──
let sheetId = null;
function openStatusSheet(id) {
  const item = EQUIPMENT.find(e => e.id === id);
  if (!item) return;
  sheetId = id;
  document.getElementById('ss-name').textContent = itemName(item);
  document.getElementById('ss-meta').textContent = groupDisplay(item.group) + (item.serial ? ' · SN ' + item.serial : '');
  renderStatusSheet();
  document.getElementById('status-sheet').classList.add('open');
}
function renderStatusSheet() {
  const s = load();
  const w = s.kontor.wear[sheetId] || { status:null, comment:'' };
  const val = [
    ['ok', 'Hel och fungerar', 'var(--accent)'],
    ['slitage', 'Slitage', 'var(--warn)'],
    ['skadad', 'Skadad', 'var(--danger)']
  ];
  document.getElementById('ss-opts').innerHTML = val.map(function(v) {
    return '<div class="opt' + (w.status === v[0] ? ' sel' : '') + '" data-status="' + v[0] + '">'
      + '<span class="dot" style="background:' + v[2] + '"></span>' + v[1] + '<span class="tick">✓</span></div>';
  }).join('');
  document.querySelectorAll('#ss-opts .opt').forEach(el => el.addEventListener('click', function() { setWear(sheetId, this.dataset.status); }));
  const ta = document.getElementById('ss-comment');
  const visa = w.status === 'slitage' || w.status === 'skadad';
  ta.style.display = visa ? 'block' : 'none';
  ta.value = w.comment || '';
}
function closeStatusSheet() {
  const ta = document.getElementById('ss-comment');
  if (sheetId !== null && ta.style.display !== 'none') setWearComment(sheetId, ta.value);
  sheetId = null;
  document.getElementById('status-sheet').classList.remove('open');
  renderKontor();
}

function copyBtsName() {
  const s = load();
  const name = s.utresa.date + ' - ' + s.utresa.customer;
  navigator.clipboard.writeText(name)
    .then(() => toast('Kopierat: ' + name))
    .catch(() => toast('Kunde inte kopiera — skriv av namnet manuellt', true));
}

function askRestOk() {
  const s = load();
  const rest = returnedItems(s).filter(e => !s.kontor.wear[e.id] || !s.kontor.wear[e.id].status);
  if (!rest.length) return;
  openConfirm(
    'Markera ' + rest.length + ' som OK?',
    'De saker som ännu saknar status markeras som hela. Gör det bara om du har kontrollerat dem.',
    'Markera som OK', 'accent',
    function() {
      const s2 = load();
      rest.forEach(e => { if (!s2.kontor.wear[e.id]) s2.kontor.wear[e.id] = { status:null, comment:'' }; s2.kontor.wear[e.id].status = 'ok'; });
      save(s2); renderKontor();
      toast(rest.length + ' saker markerades som OK');
    }
  );
}

function gelDisplays(s) { return s.gels.map(n => { const gl = GELS.find(x => x.name === n); return gl ? gl.display : n; }); }
function itemRef(e) { return { name:itemName(e), group:groupDisplay(e.group), serial:e.serial || '' }; }

function takenSection(s) {
  let out = '--- MEDTAGEN UTRUSTNING (' + s.utresa.taken.length + ' st) ---\n\n';
  Object.entries(groups(takenItems(s))).forEach(function([gname, items]) {
    out += '[' + groupDisplay(gname).toUpperCase() + ']\n';
    items.forEach(e => { out += '  * ' + itemName(e) + serialSuffix(e) + '\n'; });
    if (gname === 'Ljus' && s.gels.length > 0) out += '  * Gels: ' + gelDisplays(s).join(', ') + '\n';
    out += '\n';
  });
  return out;
}

// Loggar utresan i Google Sheet via backenden när utresan låses, så att teamet ser vad som är
// ute i fält redan innan uppdraget är klart. Skickas på nytt bara om innehållet har ändrats.
// Utan inlagd backend-adress hoppas loggningen över.
function reportUtresa(s) {
  if (!BACKEND_URL) return;
  const sig = JSON.stringify([s.utresa.date, s.utresa.customer, s.utresa.filmer, s.utresa.taken.slice().sort((a,b)=>a-b), s.gels.slice().sort()]);
  if (s.utresaMailed === sig) return;
  const fd = new FormData();
  fd.append('type', 'utresa');
  fd.append('tripId', s.tripId || '');
  fd.append('filmare', s.utresa.filmer);
  fd.append('kund', s.utresa.customer);
  fd.append('datum', s.utresa.date);
  fd.append('payload', JSON.stringify({ taken: takenItems(s).map(itemRef), gels: gelDisplays(s) }));
  fetch(BACKEND_URL, { method:'POST', body:fd })
    .then(r => r.text())
    .then(text => {
      let j = null;
      try { j = JSON.parse(text); } catch (e) {}
      if (!j || j.ok === false) throw new Error(j && j.error ? j.error : 'Oväntat svar från Google-skriptet');
      const s2 = load();
      if (s2.utresa.locked) { s2.utresaMailed = sig; save(s2); }
      toast('Utresa låst och loggad hos filmteamet');
    })
    .catch(fel => toast('Utresa låst, men loggningen misslyckades: ' + (fel && fel.message ? fel.message : 'ingen kontakt') , true));
}

function submitKontor() {
  const s = load();
  if (!s.utresa.locked || !s.hemresa.locked) { toast('Bekräfta hemresan först', true); return; }
  const returned = returnedItems(s);
  const missing = missingItems(s);

  // Allt som kom tillbaka måste ha en status
  const unchecked = returned.filter(e => !s.kontor.wear[e.id] || !s.kontor.wear[e.id].status);
  if (unchecked.length > 0) {
    toast(unchecked.length === 1 ? '1 sak saknar status' : unchecked.length + ' saker saknar status', true);
    const firstEl = document.getElementById('wi-' + unchecked[0].id);
    if (firstEl) {
      firstEl.scrollIntoView({ behavior:'smooth', block:'center' });
      firstEl.style.transition = 'box-shadow .2s';
      firstEl.style.boxShadow = 'inset 3px 0 0 var(--danger)';
      setTimeout(() => { firstEl.style.boxShadow = ''; }, 2500);
    }
    return;
  }

  const bts = s.hemresa.bts || {};
  if (bts.status === 'ja' && !s.kontor.btsDrive) { toast('Bekräfta att BTS-materialet ligger på Google Drive', true); return; }

  const damaged = returned
    .filter(e => { const w = s.kontor.wear[e.id]; return w && w.status && w.status !== 'ok'; })
    .map(e => ({ name:itemName(e), group:groupDisplay(e.group), serial:e.serial, status:s.kontor.wear[e.id].status, comment:s.kontor.wear[e.id].comment || '' }));
  const slit = damaged.filter(d => d.status === 'slitage').length;
  const skad = damaged.filter(d => d.status === 'skadad').length;
  const okCount = returned.length - damaged.length;
  const avvik = missing.length > 0 || damaged.length > 0;

  const statusParts = [];
  if (missing.length) statusParts.push(missing.length + ' saknas');
  if (slit) statusParts.push(slit + ' med slitage');
  if (skad) statusParts.push(skad + (skad > 1 ? ' skadade' : ' skadad'));
  const statusLine = avvik ? 'AVVIKELSER (' + statusParts.join(', ') + ')' : 'KOMPLETT (all utrustning tillbaka, inga anmärkningar)';

  const fileName = s.utresa.date + ' - ' + s.utresa.customer;

  let body = '=== UTRUSTNINGSRAPPORT ===\n';
  body += 'Status:   ' + statusLine + '\n';
  body += 'Kund:     ' + s.utresa.customer + '\n';
  body += 'Datum:    ' + s.utresa.date + '\n';
  body += 'Filmare:  ' + s.utresa.filmer + '\n';
  body += 'Skickad:  ' + new Date().toLocaleString('sv-SE') + '\n\n';
  body += takenSection(s);
  if (missing.length) {
    body += '--- SAKNAS VID HEMKOMST (' + missing.length + ' st) ---\n';
    missing.forEach(e => { body += '  * ' + itemName(e) + ' (' + groupDisplay(e.group) + ')' + serialSuffix(e) + '\n'; });
    body += '\n';
  }
  if (damaged.length) {
    body += '--- SLITAGE / SKADOR (' + damaged.length + ' st) ---\n';
    damaged.forEach(w => {
      body += '  * [' + w.status.toUpperCase() + '] ' + w.name + ' (' + w.group + ')' + (w.serial ? ' (SN: ' + w.serial + ')' : '');
      if (w.comment) body += ' — ' + w.comment;
      body += '\n';
    });
    body += '\n';
  }
  body += '--- KONTROLL ---\n';
  body += '  Kontrollerade vid hemkomst: ' + returned.length + ' st (' + okCount + ' OK' + (slit ? ', ' + slit + ' slitage' : '') + (skad ? ', ' + skad + (skad > 1 ? ' skadade' : ' skadad') : '') + ')\n\n';
  body += '--- BTS-CONTENT ---\n';
  if (bts.status === 'ja') body += '  BTS filmades och ligger på Google Drive (fil: ' + fileName + ')\n';
  else if (bts.status === 'nej') body += '  BTS filmades inte. Anledning: ' + (bts.reason || 'ej angiven') + '\n';
  else body += '  Ej registrerat\n';

  const payload = {
    taken: takenItems(s).map(itemRef),
    missing: missing.map(itemRef),
    damaged: damaged.map(d => ({ name:d.name, group:d.group, serial:d.serial || '', status:d.status, comment:d.comment })),
    gels: gelDisplays(s),
    bts: { status: bts.status || '', reason: bts.reason || '', drive: !!s.kontor.btsDrive },
    counts: { medtaget: s.utresa.taken.length, returnerat: returned.length, ok: okCount, slitage: slit, skadad: skad, saknat: missing.length }
  };
  sendReport(s, body, avvik, payload);
}

// Den senast byggda rapporten sparas så att den kan skickas om eller kopieras ut
// om något strular — filmaren ska aldrig kunna fastna.
let SISTA_RAPPORT = null;

function skickarSkarm() {
  showOverlay('<div class="screen"><div class="ring wait">⏳</div><h2 style="color:var(--muted)">Lämnar in…</h2><p>Stäng inte sidan.</p></div>');
}

function klarSkarm(text) {
  localStorage.removeItem(STORE_KEY);
  showOverlay('<div class="screen"><div class="ring">✓</div><h2>Rapporten är inlämnad</h2><p>' + text + '</p><button class="cta" onclick="newSession()">Nytt uppdrag</button></div>');
}

function sendReport(s, body, avvik, payload) {
  SISTA_RAPPORT = { s: s, body: body };
  skickarSkarm();
  if (!BACKEND_URL) {
    showSendError('Checklistan saknar adress till utrustningsloggen. Kontakta kontoret.', '');
    return;
  }
  const fd = new FormData();
  fd.append('type', 'rapport');
  fd.append('tripId', s.tripId || '');
  fd.append('filmare', s.utresa.filmer);
  fd.append('kund', s.utresa.customer);
  fd.append('datum', s.utresa.date);
  fd.append('payload', JSON.stringify(payload));
  fetch(BACKEND_URL, { method:'POST', body:fd })
    .then(r => r.text())
    .then(text => {
      let j = null;
      try { j = JSON.parse(text); } catch (e) {}
      if (!j) throw { typ:'svar', detalj: text.slice(0, 300) };
      if (j.ok === false) throw { typ:'server', detalj: j.error || '' };
      klarSkarm(avvik
        ? 'Inlämnad till utrustningsloggen. Avvikelserna syns för kontoret.'
        : 'Inlämnad till utrustningsloggen. Allt komplett och utan anmärkning.');
    })
    .catch(fel => {
      if (fel && fel.typ === 'server') {
        showSendError('Google-skriptet tog emot rapporten men kunde inte spara den.', fel.detalj);
      } else if (fel && fel.typ === 'svar') {
        showSendError('Google-skriptet svarade med något oväntat. Kontrollera att webbappen är distribuerad med åtkomst för alla.', fel.detalj);
      } else {
        showSendError('Rapporten kom inte fram. Kontrollera internet och försök igen.', '');
      }
    });
}

function kopieraRapport() {
  if (!SISTA_RAPPORT) { toast('Ingen rapport att kopiera', true); return; }
  navigator.clipboard.writeText(SISTA_RAPPORT.body)
    .then(() => toast('Rapporten kopierad — klistra in den där kontoret kan läsa den'))
    .catch(() => toast('Kunde inte kopiera automatiskt', true));
}

function showSendError(msg, detalj) {
  let h = '<div class="screen"><div class="ring bad">!</div>';
  h += '<h2 class="bad">Kunde inte lämna in</h2>';
  h += '<p>' + msg + '<br><br>Allt du fyllt i är kvar på den här enheten.</p>';
  if (detalj) h += '<div class="detail"><span>Meddelande från servern</span>' + esc(detalj) + '</div>';
  h += '<button class="cta" onclick="closeOverlay();submitKontor()">Försök igen</button>';
  h += '<button class="btn-quiet" onclick="kopieraRapport()">Kopiera rapporten</button>';
  h += '<button class="btn-quiet" onclick="closeOverlay()">Tillbaka till checklistan</button>';
  h += '</div>';
  showOverlay(h);
}

function newSession() { localStorage.removeItem(STORE_KEY); location.reload(); }

function askReset() {
  openConfirm(
    'Rensa allt och börja om?',
    'Hela det pågående uppdraget raderas från den här enheten och ingen rapport lämnas in. Detta går inte att ångra.',
    'Rensa allt', 'danger', newSession
  );
}

function selectAllUtresa() { const s = load(); if (s.utresa.locked) return; s.utresa.taken = EQUIPMENT.map(e => e.id); save(s); renderUtresa(); }

function lockUtresa() {
  const s = load();
  const filmer = document.getElementById('filmer-name').value.trim();
  const customer = document.getElementById('customer-name').value.trim();
  const date = document.getElementById('trip-date').value;
  if (!filmer) { toast('Fyll i ditt namn', true); return; }
  if (!customer) { toast('Fyll i kundnamn', true); return; }
  if (!date) { toast('Välj datum', true); return; }
  if (!s.utresa.taken.length) { toast('Välj minst en sak', true); return; }
  s.utresa.filmer = filmer;
  s.utresa.customer = customer;
  s.utresa.date = date;
  s.utresa.locked = true;
  // Uppdrags-ID knyter ihop utresan och slutrapporten i loggen
  if (!s.tripId) s.tripId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  // Rensa referenser till saker som inte längre är medtagna (efter upplåsning och ändring)
  s.hemresa.returned = s.hemresa.returned.filter(id => s.utresa.taken.includes(id));
  Object.keys(s.kontor.wear).forEach(id => { if (!s.utresa.taken.includes(parseInt(id))) delete s.kontor.wear[id]; });
  const bts = s.hemresa.bts || {};
  if (!bts.status && !s.btsShown) {
    s.btsShown = true;
    document.getElementById('bts-modal').classList.add('open');
  }
  save(s); render();
  reportUtresa(s);
}

function unlockUtresa() {
  const s = load();
  if (s.hemresa.locked) {
    openConfirm(
      'Lås upp utresan?',
      'Hemresans bekräftelse tas också bort. Det du redan har bockat i finns kvar, så du kan ändra och låsa igen.',
      'Lås upp', 'accent', doUnlockUtresa
    );
  } else {
    doUnlockUtresa();
  }
}
function doUnlockUtresa() {
  const s = load();
  s.utresa.locked = false;
  s.hemresa.locked = false;
  save(s); render();
  toast('Utresan är upplåst — ändra och lås igen');
}

function unlockHemresa() {
  const s = load();
  s.hemresa.locked = false;
  save(s); render();
  toast('Hemresan är upplåst — ändra och bekräfta igen');
}

function selectAllHemresa() { const s = load(); if (s.hemresa.locked) return; s.hemresa.returned = s.utresa.taken.slice(); save(s); renderHemresa(); }

function lockHemresa() {
  const s = load();
  const bts = s.hemresa.bts || {};
  if (!bts.status) { toast('Besvara BTS-frågan först', true); return; }
  if (bts.status === 'nej') {
    const reasonEl = document.getElementById('bts-reason');
    const reason = reasonEl ? reasonEl.value.trim() : (bts.reason || '');
    if (!reason) { toast('Ange varför BTS inte filmades', true); return; }
    s.hemresa.bts.reason = reason;
    save(s);
  }
  const missing = missingItems(s);
  if (missing.length) {
    const list = '<ul class="sheet-list">' + missing.map(e => '<li>' + esc(itemName(e)) + ' <span style="color:var(--faint)">' + esc(groupDisplay(e.group)) + '</span></li>').join('') + '</ul>';
    openConfirm(
      missing.length === 1 ? '1 sak är inte avbockad' : missing.length + ' saker är inte avbockade',
      'Detta rapporteras som saknat. Har du något av det med dig? Välj Avbryt och bocka av det först.' + list,
      'De saknas — bekräfta', 'danger', doLockHemresa
    );
    return;
  }
  doLockHemresa();
}
function doLockHemresa() {
  const s = load();
  s.hemresa.locked = true;
  save(s);
  toast('Hemresa bekräftad');
  switchTab('kontor');
}

function toggleItem(id) { const s = load(); if (s.utresa.locked) return; const i = s.utresa.taken.indexOf(id); if (i === -1) s.utresa.taken.push(id); else s.utresa.taken.splice(i,1); save(s); renderUtresa(); }
function toggleGel(name) { const s = load(); if (s.utresa.locked) return; const i = s.gels.indexOf(name); if (i === -1) s.gels.push(name); else s.gels.splice(i,1); save(s); renderUtresa(); }
function toggleGroupAll(gname) { const s = load(); if (s.utresa.locked) return; const items = EQUIPMENT.filter(e => e.group === gname); const allC = items.every(e => s.utresa.taken.includes(e.id)); items.forEach(item => { if (allC) { s.utresa.taken = s.utresa.taken.filter(id => id !== item.id); } else { if (!s.utresa.taken.includes(item.id)) s.utresa.taken.push(item.id); } }); save(s); renderUtresa(); }
function toggleGroupOpen(gname) { const s = load(); s.openGroups[gname] = s.openGroups[gname] === false ? true : false; save(s); renderUtresa(); }
function toggleHemItem(id) { const s = load(); if (s.hemresa.locked) return; const i = s.hemresa.returned.indexOf(id); if (i === -1) s.hemresa.returned.push(id); else s.hemresa.returned.splice(i,1); save(s); renderHemresa(); }
function toggleHemGroupAll(gname) { const s = load(); if (s.hemresa.locked) return; const items = EQUIPMENT.filter(e => s.utresa.taken.includes(e.id) && e.group === gname); const allC = items.every(e => s.hemresa.returned.includes(e.id)); items.forEach(item => { if (allC) { s.hemresa.returned = s.hemresa.returned.filter(id => id !== item.id); } else { if (!s.hemresa.returned.includes(item.id)) s.hemresa.returned.push(item.id); } }); save(s); renderHemresa(); }
function toggleHemGroupOpen(gname) { const s = load(); s.openGroups['h_' + gname] = s.openGroups['h_' + gname] === false ? true : false; save(s); renderHemresa(); }
function setWear(id, status) { const s = load(); if (!s.kontor.wear[id]) s.kontor.wear[id] = { status:null, comment:'' }; s.kontor.wear[id].status = status; if (status === 'ok') s.kontor.wear[id].comment = ''; save(s); if (sheetId === id) renderStatusSheet(); }
function setWearComment(id, val) { const s = load(); if (!s.kontor.wear[id]) s.kontor.wear[id] = { status:null, comment:'' }; s.kontor.wear[id].comment = val; save(s); }

// Namn, kund och datum sparas löpande så att inget försvinner om sidan laddas om
function bindDraftFields() {
  [['filmer-name','filmer'], ['customer-name','customer'], ['trip-date','date']].forEach(function([id, key]) {
    const el = document.getElementById(id);
    const store = function() { const s = load(); if (s.utresa.locked) return; s.utresa[key] = el.value; save(s); };
    el.addEventListener('input', store);
    el.addEventListener('change', store);
  });
}

// ── START ──
// Pågående arbete får aldrig raderas vid sidladdning — allt återställs från localStorage,
// och appen öppnar på det steg där användaren är i flödet.
(function init() {
  bindDraftFields();
  const s = load();
  if (!s.utresa.date) document.getElementById('trip-date').valueAsDate = new Date();
  if (s.utresa.locked) {
    switchTab(s.hemresa.locked ? 'kontor' : 'hemresa');
  } else {
    render();
  }
  // Offlinestöd: cachar appen så att den startar även utan uppkoppling
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() { navigator.serviceWorker.register('./sw.js').catch(function() {}); });
  }
})();
