<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XFT Checklista">
<title>XFT Utrustningschecklista</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f; --surface: #18181b; --surface2: #222226;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.15);
    --text: #f4f4f5; --muted: #a1a1aa;
    --accent: #35e375; --accent-dim: rgba(53,227,117,0.12);
    --danger: #ff4d4d; --danger-dim: rgba(255,77,77,0.1);
    --success: #4ade80; --success-dim: rgba(74,222,128,0.1);
    --warning: #fbbf24; --warning-dim: rgba(251,191,36,0.1);
    --radius: 12px; --radius-lg: 18px; --tab-h: 72px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; }
  header { background: var(--bg); padding: 1.5rem 1rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; border-bottom: 1px solid var(--border); }
  .neon-logo-wrap { position: relative; text-align: center; padding: 0.5rem 0; }
  .neon-svg-wrap { display: inline-block; width: clamp(200px, 55vw, 340px); opacity: 0; animation: neonFadeIn 1s ease forwards; filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 5px #ffffff) drop-shadow(0 0 17px rgba(255,255,255,0.19)); overflow: visible; padding: 16px; box-sizing: border-box; }
  .neon-svg-wrap svg { overflow: visible; display: block; }
  .neon-divider { width: 0%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), #35e475, rgba(255,255,255,0.4), transparent); margin: 6px auto 8px; box-shadow: 0 0 6px rgba(255,255,255,0.3); animation: expandLine 0.7s ease 1.1s forwards; }
  .neon-subtitle { font-family: 'Exo 2', sans-serif; font-size: clamp(11px, 3vw, 16px); font-weight: 300; letter-spacing: 0.18em; opacity: 0; animation: neonFadeIn 0.7s ease 1.4s forwards; display: flex; align-items: center; justify-content: center; }
  .neon-subtitle .part-expendo { color: #ffffff; filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px rgba(255,255,255,0.8)) drop-shadow(0 0 30px rgba(255,255,255,0.4)); animation: whitePulse 3s ease-in-out infinite; }
  .neon-subtitle .sep { margin: 0 10px; color: rgba(255,255,255,0.25); }
  .neon-subtitle .part-film { color: #35e475; filter: drop-shadow(0 0 5px #35e475) drop-shadow(0 0 12px #35e47580); animation: greenPulse 3s ease-in-out infinite; }
  @keyframes whitePulse { 0%,100% { filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px rgba(255,255,255,0.7)) drop-shadow(0 0 25px rgba(255,255,255,0.3)); } 50% { filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 20px rgba(255,255,255,0.9)) drop-shadow(0 0 45px rgba(255,255,255,0.5)); } }
  @keyframes greenPulse { 0%,100% { filter: drop-shadow(0 0 4px #35e475) drop-shadow(0 0 10px #35e47560); } 50% { filter: drop-shadow(0 0 7px #35e475) drop-shadow(0 0 18px #35e47590); } }
  @keyframes neonFadeIn { to{opacity:1} }
  @keyframes expandLine { to{width:100%} }
  .header-sub { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .header-title { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
  .header-version { font-size: 0.6rem; color: var(--muted); opacity: 0.7; letter-spacing: 0.08em; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--tab-h); background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: transparent; color: var(--muted); font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  .nav-btn .icon { font-size: 1.4rem; line-height: 1; }
  .nav-btn.active { color: var(--accent); }
  .nav-status { font-size: 0.55rem; color: var(--accent); height: 8px; }
  .main { padding: 1.25rem 1rem calc(var(--tab-h) + var(--actions-h, 0px) + 2rem); max-width: 600px; margin: 0 auto; }
  /* Huvudknappen ligger fast ovanför flikraden så att den aldrig hamnar utom synhåll
     när utrustningslistan är lång. --actions-h mäts i syncActionBar(). */
  .phase-actions { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); z-index: 90; max-width: 600px; margin: 0 auto; padding: 0.7rem 1rem 0.85rem; background: var(--bg); border-top: 1px solid var(--border); box-shadow: 0 -10px 24px rgba(0,0,0,0.6); }
  .phase-actions .action-btn { margin-top: 0; }
  .actions-status { font-size: 0.68rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: center; margin-bottom: 0.55rem; }
  .actions-status .done { color: var(--accent); }
  .actions-status .todo { color: var(--warning); }
  .top-actions { margin-bottom: 1rem; }
  .top-actions .action-btn-sec { margin-top: 0; }
  .phase-panel { display: none; }
  .phase-panel.active { display: block; }
  .session-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.25rem; }
  .field-group { margin-bottom: 1rem; }
  .field-group:last-child { margin-bottom: 0; }
  .field-group label { display: block; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; font-weight: 600; }
  .field-group input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 0.875rem 1rem; color: var(--text); font-size: 1rem; outline: none; -webkit-appearance: none; }
  .field-group input:focus { border-color: var(--accent); }
  .locked-banner { display: flex; align-items: center; gap: 0.75rem; background: var(--accent-dim); border: 1px solid rgba(53,227,117,0.2); border-radius: var(--radius); padding: 0.875rem 1rem; margin-bottom: 1.25rem; font-size: 0.82rem; color: var(--accent); }
  .locked-info { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .banner-btn { flex-shrink: 0; background: transparent; border: 1px solid rgba(53,227,117,0.4); color: var(--accent); border-radius: 8px; padding: 0.4rem 0.85rem; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; }
  .banner-btn:active { background: var(--accent-dim); }
  .group-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 0.75rem; }
  .group-header { display: flex; align-items: center; padding: 1rem 1.25rem; gap: 0.75rem; cursor: pointer; user-select: none; min-height: 64px; }
  .group-header:active { background: var(--surface2); }
  .group-icon { font-size: 1.2rem; flex-shrink: 0; }
  .group-name { font-size: 1rem; font-weight: 700; color: var(--text); flex: 1; }
  .group-count { font-size: 0.72rem; color: var(--muted); flex-shrink: 0; }
  .group-chevron { font-size: 0.7rem; color: var(--muted); flex-shrink: 0; margin-left: 0.25rem; }
  .group-check { width: 28px; height: 28px; flex-shrink: 0; border: 2px solid var(--border2); border-radius: 8px; background: transparent; display: flex; align-items: center; justify-content: center; transition: all 0.15s; position: relative; }
  .group-check.checked { background: var(--accent); border-color: var(--accent); }
  .group-check.checked::after { content: ""; position: absolute; width: 14px; height: 8px; border-left: 2.5px solid #111; border-bottom: 2.5px solid #111; transform: rotate(-45deg) translateY(-1px); }
  .group-check.partial { background: var(--accent); border-color: var(--accent); }
  .item-row { display: flex; align-items: center; padding: 0.875rem 1.25rem; border-top: 1px solid var(--border); gap: 1rem; min-height: 54px; cursor: pointer; user-select: none; background: rgba(0,0,0,0.15); }
  .item-row:active { background: var(--surface2); }
  .item-row.not-taken { opacity: 0.3; }
  .item-check { width: 24px; height: 24px; flex-shrink: 0; border: 2px solid var(--border2); border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center; transition: all 0.15s; position: relative; }
  .item-check.checked { background: var(--accent); border-color: var(--accent); }
  .item-check.checked::after { content: ""; position: absolute; width: 12px; height: 7px; border-left: 2px solid #111; border-bottom: 2px solid #111; transform: rotate(-45deg) translateY(-1px); }
  .item-name { font-size: 0.9rem; color: var(--text); flex: 1; line-height: 1.3; }
  .item-serial { font-size: 0.65rem; color: var(--muted); flex-shrink: 0; }
  .phase-badge { display: inline-flex; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
  .badge-taken { background: var(--success-dim); color: var(--success); }
  .badge-missing { background: var(--danger-dim); color: var(--danger); }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 1.25rem; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
  .action-btn { width: 100%; padding: 1.1rem; border: none; border-radius: var(--radius-lg); background: var(--accent); color: #111; font-size: 1rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; margin-top: 1rem; }
  .action-btn:active { opacity: 0.85; }
  .action-btn-sec { width: 100%; padding: 0.875rem; border: 1px solid var(--border2); border-radius: var(--radius-lg); background: transparent; color: var(--muted); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; margin-top: 0.75rem; }
  .action-btn-sec:active { background: var(--surface2); color: var(--text); }
  .reset-btn { display: block; width: 100%; margin-top: 1.5rem; background: transparent; border: none; color: var(--danger); opacity: 0.6; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; padding: 0.75rem; }
  .reset-btn:active { opacity: 1; }
  .wear-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 1rem; }
  .wear-card-header { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--warning); }
  .wear-item { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
  .wear-item:last-child { border-bottom: none; }
  .wear-item.needs-status { background: rgba(255,77,77,0.06); border-left: 3px solid var(--danger); }
  .wear-item-name { font-size: 0.9rem; margin-bottom: 0.75rem; line-height: 1.3; }
  .wear-opts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
  .wear-opt { padding: 0.7rem 0.25rem; border-radius: var(--radius); font-size: 0.78rem; font-weight: 600; border: 1.5px solid var(--border2); background: transparent; color: var(--muted); cursor: pointer; text-align: center; }
  .wear-opt:active { opacity: 0.7; }
  .wear-opt.ok.sel { background: var(--success-dim); border-color: var(--success); color: var(--success); }
  .wear-opt.slitage.sel { background: var(--warning-dim); border-color: var(--warning); color: var(--warning); }
  .wear-opt.skadad.sel { background: var(--danger-dim); border-color: var(--danger); color: var(--danger); }
  .wear-comment { width: 100%; margin-top: 0.75rem; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 0.75rem 1rem; color: var(--text); font-size: 0.9rem; resize: none; outline: none; display: none; -webkit-appearance: none; }
  .wear-comment:focus { border-color: var(--warning); }
  .wear-comment.show { display: block; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal-sheet { background: var(--surface); border-top: 1px solid var(--border2); border-radius: 20px 20px 0 0; padding: 1.5rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom)); width: 100%; max-width: 600px; }
  .modal-handle { width: 40px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 1.25rem; }
  .modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 1.25rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .modal-btn { width: 100%; padding: 1rem; border: none; border-radius: var(--radius-lg); font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 0.5rem; }
  .modal-btn-danger { background: var(--danger-dim); color: var(--danger); border: 1px solid var(--danger); }
  .modal-btn-accent { background: var(--accent); color: #111; }
  .modal-btn-cancel { background: var(--surface2); color: var(--muted); border: none; }
  .modal-list { list-style: none; margin: 0.75rem 0 0.25rem; padding: 0; max-height: 35vh; overflow-y: auto; }
  .modal-list li { padding: 0.45rem 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; color: var(--text); }
  .modal-list li:last-child { border-bottom: none; }
  .send-overlay { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 400; overflow-y: auto; }
  .send-overlay.open { display: block; }
  .toast { position: fixed; bottom: calc(var(--tab-h) + var(--actions-h, 0px) + 1rem); left: 50%; transform: translateX(-50%) translateY(120px); background: #1c1c20; border: 1px solid var(--border2); color: var(--text); padding: 0.875rem 1.5rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; transition: transform 0.3s, visibility 0.3s; z-index: 999; box-shadow: 0 4px 24px rgba(0,0,0,0.6); max-width: 88vw; text-align: center; line-height: 1.4; pointer-events: none; visibility: hidden; }
  .toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }
  .toast.toast-error { border-color: var(--danger); color: var(--danger); background: #1a0e0e; }
  .success-screen { display: flex; flex-direction: column; align-items: center; padding: 3rem 1rem; text-align: center; gap: 1.25rem; max-width: 600px; margin: 0 auto; }
  .success-icon { width: 80px; height: 80px; border-radius: 50%; background: var(--accent-dim); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
  .success-title { font-size: 1.5rem; font-weight: 800; color: var(--accent); }
  .success-sub { color: var(--muted); font-size: 0.9rem; line-height: 1.7; }
  .success-screen .action-btn, .success-screen .action-btn-sec { max-width: 320px; }
  .gels-row { padding: 0.875rem 1.25rem; border-top: 1px solid var(--border); }
  .gels-label { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 0.6rem; }
  .gels-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .gel-chip { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.35rem 0.75rem; border-radius: 20px; border: 1.5px solid var(--border2); background: transparent; color: var(--muted); font-size: 0.78rem; font-weight: 600; cursor: pointer; user-select: none; transition: all 0.15s; }
  .gel-chip:active { opacity: 0.7; }
  .gel-chip.sel { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }
  .gel-chip.locked { pointer-events: none; }
  .gel-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>

  <div class="neon-logo-wrap">
    <div class="neon-svg-wrap">
      <svg viewBox="0 0 704 215" xmlns="http://www.w3.org/2000/svg">

    <span class="header-title">Utrustningschecklista — Filmteamet</span>

<div class="modal-overlay" id="confirm-modal" onclick="if(event.target===this)closeConfirm()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="confirm-title"></div>
    <div id="confirm-body" style="color:var(--muted);font-size:0.9rem;line-height:1.6;margin-bottom:0.5rem;"></div>
    <button class="modal-btn modal-btn-danger" id="confirm-btn" onclick="runConfirm()"></button>
    <button class="modal-btn modal-btn-cancel" onclick="closeConfirm()">Avbryt</button>
  </div>
</div>

<div class="modal-overlay" id="bts-modal" style="align-items:center;padding:1.5rem;">
  <div class="modal-sheet" style="border-radius:var(--radius-lg);">
    <div class="modal-handle"></div>
    <div class="modal-title" style="color:var(--warning)">Glöm inte BTS-content!</div>
    <p style="color:var(--muted);font-size:0.9rem;line-height:1.6;margin-bottom:1.25rem;">Filma bakom kulisserna under inspelningen. BTS-content är avgörande för bolagets marknadsföring.</p>
    <button class="modal-btn" style="background:var(--accent);color:#111;" onclick="document.getElementById('bts-modal').classList.remove('open')">Förstått, jag filmar BTS</button>
  </div>
</div>

<div class="send-overlay" id="send-overlay"></div>

<div class="main">
  <div class="phase-panel active" id="panel-utresa">
    <div class="session-card" id="session-form">
      <div class="field-group">
        <label>Ditt namn</label>
        <input type="text" id="filmer-name" placeholder="t.ex. Petrus" autocomplete="name">
      </div>
      <div class="field-group">
        <label>Kundnamn</label>
        <input type="text" id="customer-name" placeholder="t.ex. Björk &amp; Partners AB" autocomplete="off">
      </div>
      <div class="field-group">
        <label>Datum</label>
        <input type="date" id="trip-date">
      </div>
    </div>
    <div id="locked-banner" style="display:none" class="locked-banner">🔒 <span class="locked-info" id="locked-text"></span><button class="banner-btn" onclick="unlockUtresa()">Ändra</button></div>
    <div class="top-actions" id="utresa-top-actions">
      <button class="action-btn-sec" onclick="selectAllUtresa()">Välj all utrustning</button>
    </div>
    <div id="checklist-utresa"></div>
    <button class="reset-btn" onclick="askReset()">Rensa allt och börja om</button>
    <div class="phase-actions" id="utresa-actions">
      <div class="actions-status" id="utresa-status"></div>
      <button class="action-btn" onclick="lockUtresa()">Bekräfta och lås utresa</button>
    </div>
  </div>

  <div class="phase-panel" id="panel-hemresa">
    <div id="locked-banner-hemresa" class="locked-banner" style="display:none">🔒 <span class="locked-info" id="locked-text-hemresa"></span><button class="banner-btn" onclick="unlockHemresa()">Ändra</button></div>
    <div class="top-actions" id="hemresa-top-actions">
      <button class="action-btn-sec" onclick="selectAllHemresa()">Välj alla returnerade</button>
    </div>
    <div id="checklist-hemresa"></div>
    <div class="phase-actions" id="hemresa-actions">
      <div class="actions-status" id="hemresa-status"></div>
      <button class="action-btn" onclick="lockHemresa()">Bekräfta hemresa</button>
    </div>
  </div>

function freshState() {
  return { utresa:{locked:false,filmer:'',customer:'',date:'',taken:[]}, hemresa:{locked:false,returned:[]}, kontor:{wear:{}}, openGroups:{}, gels:[], btsShown:false };
}
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e) {}
  const f = freshState();
  if (!s || typeof s !== 'object') return f;
  s.utresa = Object.assign(f.utresa, s.utresa);
  s.hemresa = Object.assign(f.hemresa, s.hemresa);
  s.kontor = Object.assign(f.kontor, s.kontor);
  if (!Array.isArray(s.utresa.taken)) s.utresa.taken = [];
  if (!Array.isArray(s.hemresa.returned)) s.hemresa.returned = [];
  if (!s.kontor.wear || typeof s.kontor.wear !== 'object') s.kontor.wear = {};
  if (!s.openGroups || typeof s.openGroups !== 'object') s.openGroups = {};
  if (!Array.isArray(s.gels)) s.gels = [];
  return s;
}
function save(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function itemName(item) { return ITEM_NAMES[item.id] || item.name; }
function groupDisplay(g) { return DISPLAY_NAMES[g] || g; }
function serialSuffix(item) { return item.serial ? ' (SN: ' + item.serial + ')' : ''; }
function takenItems(s) { return EQUIPMENT.filter(e => s.utresa.taken.includes(e.id)); }
function returnedItems(s) { return EQUIPMENT.filter(e => s.utresa.taken.includes(e.id) && s.hemresa.returned.includes(e.id)); }
function missingItems(s) { return EQUIPMENT.filter(e => s.utresa.taken.includes(e.id) && !s.hemresa.returned.includes(e.id)); }

function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' toast-error' : '');
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), isError ? 3500 : 2400);
}

// Generisk bekräftelsedialog
let confirmFn = null;
function openConfirm(title, bodyHtml, btnLabel, style, fn) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-title').style.color = style === 'accent' ? 'var(--text)' : 'var(--danger)';
  document.getElementById('confirm-body').innerHTML = bodyHtml;
  const btn = document.getElementById('confirm-btn');
  btn.textContent = btnLabel;
  btn.className = 'modal-btn ' + (style === 'accent' ? 'modal-btn-accent' : 'modal-btn-danger');
  confirmFn = fn;
  document.getElementById('confirm-modal').classList.add('open');
}
function runConfirm() { const fn = confirmFn; closeConfirm(); if (fn) fn(); }
function closeConfirm() { confirmFn = null; document.getElementById('confirm-modal').classList.remove('open'); }

function showOverlay(html) { const o = document.getElementById('send-overlay'); o.innerHTML = html; o.classList.add('open'); }
function closeOverlay() { document.getElementById('send-overlay').classList.remove('open'); }

// Reserverar plats nederst för den fasta knappraden, så att sista listraden och
// toast-rutan aldrig hamnar bakom den.
function syncActionBar() {
  const bar = document.querySelector('.phase-panel.active .phase-actions');
  const synlig = bar && getComputedStyle(bar).display !== 'none';
  document.documentElement.style.setProperty('--actions-h', (synlig ? bar.offsetHeight : 0) + 'px');
}

function statusText(klara, totalt, ord) {
  const kvar = totalt - klara;
  if (!totalt) return '';
  return kvar === 0
    ? '<span class="done">✓ ' + totalt + ' av ' + totalt + ' ' + ord + '</span>'
    : klara + ' av ' + totalt + ' ' + ord + ' · <span class="todo">' + kvar + ' kvar</span>';
}

function switchTab(tab) {
  document.querySelectorAll('.phase-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  render();
}

function groups(items) {
  const g = {};
  items.forEach(i => { if (!g[i.group]) g[i.group] = []; g[i.group].push(i); });
  return g;
}

function render() {
  renderUtresa(); renderHemresa(); renderKontor();
  const s = load();
  document.getElementById('ns-utresa').textContent = s.utresa.locked ? '✓' : '';
  document.getElementById('ns-hemresa').textContent = s.hemresa.locked ? '✓' : '';
}

function renderUtresa() {
  const s = load();
  document.getElementById('session-form').style.display = s.utresa.locked ? 'none' : 'block';
  document.getElementById('utresa-actions').style.display = s.utresa.locked ? 'none' : 'block';
  document.getElementById('utresa-top-actions').style.display = s.utresa.locked ? 'none' : 'block';
  document.getElementById('utresa-status').innerHTML = statusText(s.utresa.taken.length, EQUIPMENT.length, 'valda');
  const banner = document.getElementById('locked-banner');
  if (s.utresa.locked) {
    banner.style.display = 'flex';
    document.getElementById('locked-text').textContent = s.utresa.filmer + ' · ' + s.utresa.customer + ' · ' + s.utresa.date;
  } else {
    banner.style.display = 'none';
    if (s.utresa.date) document.getElementById('trip-date').value = s.utresa.date;
    if (s.utresa.filmer) document.getElementById('filmer-name').value = s.utresa.filmer;
    if (s.utresa.customer) document.getElementById('customer-name').value = s.utresa.customer;
  }
  const taken = s.utresa.taken;
  const pct = EQUIPMENT.length ? Math.round(taken.length / EQUIPMENT.length * 100) : 0;
  let html = '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
  const g = groups(EQUIPMENT);
  Object.entries(g).forEach(function([gname, items]) {
    const checked = items.filter(i => taken.includes(i.id)).length;
    const all = checked === items.length, some = checked > 0 && !all;
    const open = s.openGroups[gname] !== false;
    const genc = encodeURIComponent(gname);
    html += '<div class="group-card"><div class="group-header" data-group="' + genc + '" data-type="utresa-open">';
    html += '<div class="group-check ' + (all?'checked':some?'partial':'') + '" data-group="' + genc + '" data-type="utresa-all">';
    if (some) html += '<span style="color:#111;font-weight:700;font-size:0.9rem;line-height:1;">−</span>';
    html += '</div><span class="group-icon">' + (ICONS[gname]||'📦') + '</span>';
    html += '<span class="group-name">' + groupDisplay(gname) + '</span>';
    html += '<span class="group-count">' + checked + '/' + items.length + '</span>';
    html += '<span class="group-chevron">' + (open?'▲':'▼') + '</span></div>';
    if (open) {
      items.forEach(function(item) {
        const c = taken.includes(item.id);
        const notTaken = s.utresa.locked && !c ? ' not-taken' : '';
        html += '<div class="item-row' + notTaken + '" data-id="' + item.id + '" data-type="utresa-item">';
        html += '<div style="width:16px;flex-shrink:0"></div>';
        html += '<div class="item-check ' + (c?'checked':'') + '"></div>';
        html += '<span class="item-name">' + itemName(item) + '</span>';
        if (item.serial) html += '<span class="item-serial">SN: ' + item.serial + '</span>';
        html += '</div>';
      });
      if (gname === 'Ljus') {
        html += '<div class="gels-row"><div class="gels-label">Gels</div><div class="gels-chips">';
        GELS.forEach(function(gel) {
          const sel = s.gels.includes(gel.name);
          const locked = s.utresa.locked ? ' locked' : '';
          html += '<div class="gel-chip' + (sel?' sel':'') + locked + '" data-gel="' + gel.name + '" data-type="gel-chip">';
          html += '<span class="gel-dot" style="background:' + gel.color + '"></span>' + gel.display;
          html += '</div>';
        });
        html += '</div></div>';
      }
    }
    html += '</div>';
  });
  document.getElementById('checklist-utresa').innerHTML = html;
  document.querySelectorAll('[data-type="utresa-open"]').forEach(el => el.addEventListener('click', function(e) { if (!e.target.closest('[data-type="utresa-all"]')) toggleGroupOpen(decodeURIComponent(this.dataset.group)); }));
  document.querySelectorAll('[data-type="utresa-all"]').forEach(el => el.addEventListener('click', function(e) { e.stopPropagation(); toggleGroupAll(decodeURIComponent(this.dataset.group)); }));
  document.querySelectorAll('[data-type="utresa-item"]').forEach(el => el.addEventListener('click', function() { toggleItem(parseInt(this.dataset.id)); }));
  document.querySelectorAll('[data-type="gel-chip"]').forEach(el => el.addEventListener('click', function() { toggleGel(this.dataset.gel); }));
  syncActionBar();
}

  const s = load();
  const hemBanner = document.getElementById('locked-banner-hemresa');
  const hemActions = document.getElementById('hemresa-actions');

    hemBanner.style.display = 'none';
    document.getElementById('checklist-hemresa').innerHTML = '<p style="color:var(--muted);padding:1rem;font-size:0.85rem;">Lås utresan först.</p>';
    hemActions.style.display = 'none';
    hemTop.style.display = 'none';
    syncActionBar();
    return;
  }
  if (s.hemresa.locked) {
    hemBanner.style.display = 'flex';
    document.getElementById('locked-text-hemresa').textContent = 'Hemresa bekräftad';

    hemTop.style.display = 'none';

    hemActions.style.display = 'block';

  let html = '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
  const bts = s.hemresa.bts || { status:null, reason:'' };
  html += '<div class="group-card" style="margin-bottom:1rem;border-color:rgba(251,191,36,0.3);">';
  html += '<div style="padding:1rem 1.25rem;border-bottom:1px solid var(--border);">';
  html += '<div style="font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--warning);font-weight:600;margin-bottom:0.75rem;">BTS-Content</div>';

    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">';
    html += '<button class="wear-opt ok' + (bts.status==='ja'?' sel':'') + '" data-bts="ja" style="padding:0.875rem;">Filmad</button>';

    html += bts.status === 'ja' ? '<span style="color:var(--success);">Filmad</span>' : '<span style="color:var(--danger);">Ej filmad' + (bts.reason?' — '+esc(bts.reason):'') + '</span>';

  html += '</div></div>';
  Object.entries(g).forEach(function([gname, items]) {
    const checked = items.filter(i => ret.includes(i.id)).length;
    const all = checked === items.length, some = checked > 0 && !all;
    const open = s.openGroups['h_' + gname] !== false;
    const genc = encodeURIComponent(gname);
    html += '<div class="group-card"><div class="group-header" data-group="' + genc + '" data-type="hem-open">';
    html += '<div class="group-check ' + (all?'checked':some?'partial':'') + '" data-group="' + genc + '" data-type="hem-all">';
    if (some) html += '<span style="color:#111;font-weight:700;font-size:0.9rem;line-height:1;">−</span>';
    html += '</div><span class="group-icon">' + (ICONS[gname]||'📦') + '</span>';
    html += '<span class="group-name">' + groupDisplay(gname) + '</span>';
    html += '<span class="group-count">' + checked + '/' + items.length + '</span>';
    html += '<span class="group-chevron">' + (open?'▲':'▼') + '</span></div>';
    if (open) {
      items.forEach(function(item) {
        const c = ret.includes(item.id);
        html += '<div class="item-row" data-id="' + item.id + '" data-type="hem-item">';
        html += '<div style="width:16px;flex-shrink:0"></div>';
        html += '<div class="item-check ' + (c?'checked':'') + '"></div>';
        html += '<span class="item-name">' + itemName(item) + '</span>';
        if (s.hemresa.locked) html += c ? '<span class="phase-badge badge-taken">OK</span>' : '<span class="phase-badge badge-missing">saknas</span>';
        html += '</div>';
      });
    }
    html += '</div>';
  });
  document.getElementById('checklist-hemresa').innerHTML = html;
  document.querySelectorAll('[data-type="hem-open"]').forEach(el => el.addEventListener('click', function(e) { if (!e.target.closest('[data-type="hem-all"]')) toggleHemGroupOpen(decodeURIComponent(this.dataset.group)); }));
  document.querySelectorAll('[data-type="hem-all"]').forEach(el => el.addEventListener('click', function(e) { e.stopPropagation(); toggleHemGroupAll(decodeURIComponent(this.dataset.group)); }));
  document.querySelectorAll('[data-type="hem-item"]').forEach(el => el.addEventListener('click', function() { toggleHemItem(parseInt(this.dataset.id)); }));
  document.querySelectorAll('[data-bts]').forEach(btn => btn.addEventListener('click', function() { setBts(this.dataset.bts); }));
  const btsReasonEl = document.getElementById('bts-reason');
  if (btsReasonEl) btsReasonEl.addEventListener('input', function() { const s2 = load(); s2.hemresa.bts = s2.hemresa.bts || { status:'nej', reason:'' }; s2.hemresa.bts.reason = this.value; save(s2); });
  syncActionBar();
}

function setBts(status) {
  const s = load();
  if (s.hemresa.locked) return;
  if (!s.hemresa.bts) s.hemresa.bts = { status:null, reason:'' };
  s.hemresa.bts.status = status;
  if (status === 'ja') s.hemresa.bts.reason = '';
  save(s); renderHemresa();
}

function renderKontor() {
  const s = load();
  const wearDiv = document.getElementById('wear-checks');
  const actions = document.getElementById('kontor-actions');
  const kontorTop = document.getElementById('kontor-top-actions');
  if (!s.utresa.locked || !s.hemresa.locked) {
    wearDiv.innerHTML = '<p style="color:var(--muted);padding:1rem;font-size:0.85rem;">' + (!s.utresa.locked ? 'Lås utresan först.' : 'Bekräfta hemresan först.') + '</p>';
    actions.style.display = 'none';
    kontorTop.style.display = 'none';
    syncActionBar();
    return;
  }
  actions.style.display = 'block';
  const returned = returnedItems(s);
  const missing = missingItems(s);
  const g = groups(returned);
  const bts = s.hemresa.bts || {};
  const btsDriveChecked = s.kontor.btsDrive || false;
  const fileName = s.utresa.date + ' - ' + s.utresa.customer;
  let html = '';
  if (bts.status === 'ja') {
    html += '<div class="group-card" style="margin-bottom:1rem;border-color:rgba(251,191,36,0.3);">';
    html += '<div style="padding:1rem 1.25rem;">';
    html += '<div style="font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--warning);font-weight:600;margin-bottom:0.875rem;">BTS Google Drive</div>';
    html += '<div class="item-row" data-type="bts-drive" style="padding:0.75rem 0;border:none;background:none;cursor:pointer;">';
    html += '<div class="item-check ' + (btsDriveChecked?'checked':'') + '"></div>';
    html += '<span class="item-name">Överför BTS-content till Google Drive</span></div>';
    if (btsDriveChecked) {
      html += '<div style="margin-top:0.5rem;background:var(--surface2);border-radius:var(--radius);padding:0.75rem 1rem;font-size:0.82rem;color:var(--muted);line-height:1.6;">';
      html += 'Döp filen till:<br><div style="display:flex;align-items:center;gap:0.75rem;margin-top:0.5rem;">';
      html += '<span style="color:var(--text);font-weight:600;">' + esc(fileName) + '</span>';
      html += '<button onclick="copyBtsName()" style="border:1px solid var(--border2);background:var(--surface);color:var(--muted);border-radius:6px;padding:0.3rem 0.65rem;font-size:0.72rem;cursor:pointer;">Kopiera</button>';
      html += '</div></div>';
    }
    html += '</div></div>';
  }
  if (missing.length) {
    html += '<div class="group-card" style="margin-bottom:1rem;border-color:rgba(255,77,77,0.35);">';
    html += '<div style="padding:1rem 1.25rem;">';
    html += '<div style="font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--danger);font-weight:600;margin-bottom:0.6rem;">Saknas vid hemkomst — ' + missing.length + ' st</div>';
    missing.forEach(function(item) {
      html += '<div style="display:flex;align-items:center;gap:0.6rem;padding:0.35rem 0;font-size:0.9rem;"><span class="phase-badge badge-missing">saknas</span><span>' + itemName(item) + (item.serial ? ' <span style="color:var(--muted);font-size:0.7rem;">SN: ' + item.serial + '</span>' : '') + '</span></div>';
    });
    html += '<div style="margin-top:0.6rem;font-size:0.78rem;color:var(--muted);line-height:1.5;">Detta rapporteras som saknat. Om något ändå har kommit hem: gå till Hemresa, tryck på Ändra och bocka av det.</div>';
    html += '</div></div>';
  }
  const done = returned.filter(e => s.kontor.wear[e.id] && s.kontor.wear[e.id].status).length;
  html += '<div class="wear-card"><div class="wear-card-header"><span>Kontrollera slitage och skador</span><span style="color:var(--muted);">' + done + '/' + returned.length + '</span></div>';
  Object.entries(g).forEach(function([gname, items]) {
    html += '<div style="padding:0.75rem 1.25rem 0.25rem;border-top:1px solid var(--border);"><span style="font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);font-weight:600;">' + (ICONS[gname]||'📦') + ' ' + groupDisplay(gname) + '</span></div>';
    items.forEach(function(item) {
      const w = s.kontor.wear[item.id] || { status:null, comment:'' };
      const show = w.status === 'slitage' || w.status === 'skadad';
      const needsStatus = !w.status ? ' needs-status' : '';
      html += '<div class="wear-item' + needsStatus + '" id="wi-' + item.id + '">';
      html += '<div class="wear-item-name">' + itemName(item) + '</div>';
      html += '<div class="wear-opts">';
      html += '<button class="wear-opt ok' + (w.status==='ok'?' sel':'') + '" data-id="' + item.id + '" data-status="ok">OK</button>';
      html += '<button class="wear-opt slitage' + (w.status==='slitage'?' sel':'') + '" data-id="' + item.id + '" data-status="slitage">Slitage</button>';
      html += '<button class="wear-opt skadad' + (w.status==='skadad'?' sel':'') + '" data-id="' + item.id + '" data-status="skadad">Skadad</button>';
      html += '</div>';
      html += '<textarea class="wear-comment' + (show?' show':'') + '" rows="2" id="wc-' + item.id + '" oninput="setWearComment(' + item.id + ',this.value)" placeholder="Beskriv skadan...">' + esc(w.comment||'') + '</textarea>';
      html += '</div>';
    });
  });
  html += '</div>';
  wearDiv.innerHTML = html;
  document.querySelectorAll('.wear-opt[data-status]').forEach(btn => btn.addEventListener('click', function() { setWear(parseInt(this.dataset.id), this.dataset.status); }));
  const btsDriveRow = document.querySelector('[data-type="bts-drive"]');
  if (btsDriveRow) btsDriveRow.addEventListener('click', function() { const s2 = load(); s2.kontor.btsDrive = !s2.kontor.btsDrive; save(s2); renderKontor(); });
  const restBtn = document.getElementById('rest-ok-btn');
  const rest = returned.length - done;
  restBtn.textContent = 'Markera resterande som OK (' + rest + ')';
  kontorTop.style.display = rest > 0 ? 'block' : 'none';
  document.getElementById('kontor-status').innerHTML = statusText(done, returned.length, 'kontrollerade');
  syncActionBar();
}

function copyBtsName() {
  const s = load();
  const name = s.utresa.date + ' - ' + s.utresa.customer;
  navigator.clipboard.writeText(name)
    .then(() => toast('Kopierat: ' + name))
    .catch(() => toast('Kunde inte kopiera — skriv av namnet manuellt', true));
}

function askRestOk() {
  const s = load();
  const rest = returnedItems(s).filter(e => !s.kontor.wear[e.id] || !s.kontor.wear[e.id].status);
  if (!rest.length) return;
  openConfirm(
    'Markera resterande som OK',
    'De ' + rest.length + ' saker som ännu saknar status markeras som OK. Gör det bara om du har kontrollerat dem.',
    'Markera ' + rest.length + ' som OK', 'accent',
    function() {
      const s2 = load();
      rest.forEach(e => { if (!s2.kontor.wear[e.id]) s2.kontor.wear[e.id] = { status:null, comment:'' }; s2.kontor.wear[e.id].status = 'ok'; });
      save(s2); renderKontor();
      toast(rest.length + ' saker markerades som OK');
    }
  );
}

function gelDisplays(s) { return s.gels.map(n => { const gl = GELS.find(x => x.name === n); return gl ? gl.display : n; }); }
function itemRef(e) { return { name:itemName(e), group:groupDisplay(e.group), serial:e.serial || '' }; }

function takenSection(s) {
  let out = '--- MEDTAGEN UTRUSTNING (' + s.utresa.taken.length + ' st) ---\n\n';
  Object.entries(groups(takenItems(s))).forEach(function([gname, items]) {
    out += '[' + groupDisplay(gname).toUpperCase() + ']\n';
    items.forEach(e => { out += '  * ' + itemName(e) + serialSuffix(e) + '\n'; });
    if (gname === 'Ljus' && s.gels.length > 0) out += '  * Gels: ' + gelDisplays(s).join(', ') + '\n';
    out += '\n';
  });
  return out;
}

function buildForm(subject, s, body) {
  const fd = new FormData();
  fd.append('_subject', subject);
  fd.append('Filmare', s.utresa.filmer);
  fd.append('Kund', s.utresa.customer);
  fd.append('Datum', s.utresa.date);
  fd.append('Rapport', body);
  return fd;
}

// Loggar utresan i Google Sheet via backenden när utresan låses, så att teamet ser vad som är
// ute i fält redan innan uppdraget är klart. Skickas på nytt bara om innehållet har ändrats.
// Utan backend hoppas loggningen över — Formspree-kvoten behöver rymma slutrapporterna.
function reportUtresa(s) {
  if (!BACKEND_URL) return;
  const sig = JSON.stringify([s.utresa.date, s.utresa.customer, s.utresa.filmer, s.utresa.taken.slice().sort((a,b)=>a-b), s.gels.slice().sort()]);
  if (s.utresaMailed === sig) return;
  const fd = new FormData();
  fd.append('type', 'utresa');
  fd.append('tripId', s.tripId || '');
  fd.append('filmare', s.utresa.filmer);
  fd.append('kund', s.utresa.customer);
  fd.append('datum', s.utresa.date);
  fd.append('payload', JSON.stringify({ taken: takenItems(s).map(itemRef), gels: gelDisplays(s) }));
  fetch(BACKEND_URL, { method:'POST', body:fd })
    .then(r => r.json())
    .then(j => {
      if (!j || j.ok === false) throw new Error('backend');
      const s2 = load();
      if (s2.utresa.locked) { s2.utresaMailed = sig; save(s2); }
      toast('Utresa låst och loggad hos filmteamet');
    })
    .catch(() => toast('Utresa låst. Loggningen kunde inte skickas nu — allt kommer med i slutrapporten.', true));
}

function submitKontor() {
  const s = load();
  if (!s.utresa.locked || !s.hemresa.locked) { toast('Bekräfta hemresan först', true); return; }
  const returned = returnedItems(s);
  const missing = missingItems(s);

  // Allt som kom tillbaka måste ha en status
  const unchecked = returned.filter(e => !s.kontor.wear[e.id] || !s.kontor.wear[e.id].status);
  if (unchecked.length > 0) {
    toast(unchecked.length === 1 ? '1 sak saknar status — den är markerad med rött' : unchecked.length + ' saker saknar status — den första är markerad med rött', true);
    const firstEl = document.getElementById('wi-' + unchecked[0].id);
    if (firstEl) {
      firstEl.scrollIntoView({ behavior:'smooth', block:'center' });
      firstEl.style.transition = 'box-shadow 0.2s';
      firstEl.style.boxShadow = '0 0 0 2px var(--danger)';
      setTimeout(() => { firstEl.style.boxShadow = ''; }, 2500);
    }
    return;
  }

  const bts = s.hemresa.bts || {};
  if (bts.status === 'ja' && !s.kontor.btsDrive) { toast('Bekräfta att BTS-materialet ligger på Google Drive', true); return; }

  const damaged = returned
    .filter(e => { const w = s.kontor.wear[e.id]; return w && w.status && w.status !== 'ok'; })
    .map(e => ({ name:itemName(e), group:groupDisplay(e.group), serial:e.serial, status:s.kontor.wear[e.id].status, comment:s.kontor.wear[e.id].comment || '' }));
  const slit = damaged.filter(d => d.status === 'slitage').length;
  const skad = damaged.filter(d => d.status === 'skadad').length;
  const okCount = returned.length - damaged.length;
  const avvik = missing.length > 0 || damaged.length > 0;

  const statusParts = [];
  if (missing.length) statusParts.push(missing.length + ' saknas');
  if (slit) statusParts.push(slit + ' med slitage');
  if (skad) statusParts.push(skad + (skad > 1 ? ' skadade' : ' skadad'));
  const statusLine = avvik ? 'AVVIKELSER (' + statusParts.join(', ') + ')' : 'KOMPLETT (all utrustning tillbaka, inga anmärkningar)';

  const fileName = s.utresa.date + ' - ' + s.utresa.customer;

  let body = '=== UTRUSTNINGSRAPPORT ===\n';
  body += 'Status:   ' + statusLine + '\n';
  body += 'Kund:     ' + s.utresa.customer + '\n';
  body += 'Datum:    ' + s.utresa.date + '\n';
  body += 'Filmare:  ' + s.utresa.filmer + '\n';
  body += 'Skickad:  ' + new Date().toLocaleString('sv-SE') + '\n\n';
  body += takenSection(s);
  if (missing.length) {
    body += '--- SAKNAS VID HEMKOMST (' + missing.length + ' st) ---\n';
    missing.forEach(e => { body += '  * ' + itemName(e) + ' (' + groupDisplay(e.group) + ')' + serialSuffix(e) + '\n'; });
    body += '\n';
  }
  if (damaged.length) {
    body += '--- SLITAGE / SKADOR (' + damaged.length + ' st) ---\n';
    damaged.forEach(w => {
      body += '  * [' + w.status.toUpperCase() + '] ' + w.name + ' (' + w.group + ')' + (w.serial ? ' (SN: ' + w.serial + ')' : '');
      if (w.comment) body += ' — ' + w.comment;
      body += '\n';
    });
    body += '\n';
  }
  body += '--- KONTROLL ---\n';
  body += '  Kontrollerade vid hemkomst: ' + returned.length + ' st (' + okCount + ' OK' + (slit ? ', ' + slit + ' slitage' : '') + (skad ? ', ' + skad + (skad > 1 ? ' skadade' : ' skadad') : '') + ')\n\n';
  body += '--- BTS-CONTENT ---\n';
  if (bts.status === 'ja') body += '  BTS filmades och ligger på Google Drive (fil: ' + fileName + ')\n';
  else if (bts.status === 'nej') body += '  BTS filmades inte. Anledning: ' + (bts.reason || 'ej angiven') + '\n';
  else body += '  Ej registrerat\n';

  const payload = {
    taken: takenItems(s).map(itemRef),
    missing: missing.map(itemRef),
    damaged: damaged.map(d => ({ name:d.name, group:d.group, serial:d.serial || '', status:d.status, comment:d.comment })),
    gels: gelDisplays(s),
    bts: { status: bts.status || '', reason: bts.reason || '', drive: !!s.kontor.btsDrive },
    counts: { medtaget: s.utresa.taken.length, returnerat: returned.length, ok: okCount, slitage: slit, skadad: skad, saknat: missing.length }
  };
  sendReport(s, body, avvik, payload);
}

function sendReport(s, body, avvik, payload) {
  showOverlay('<div class="success-screen"><div class="success-icon" style="font-size:1.5rem;">⏳</div><div class="success-title" style="color:var(--muted);">Skickar rapport…</div><div class="success-sub">Stäng inte sidan.</div></div>');
  const subject = 'Utrustningsrapport - ' + s.utresa.customer + ' - ' + s.utresa.date + (avvik ? ' - AVVIKELSER' : '');
  let req;
  if (BACKEND_URL) {
    const fd = new FormData();
    fd.append('type', 'rapport');
    fd.append('tripId', s.tripId || '');
    fd.append('filmare', s.utresa.filmer);
    fd.append('kund', s.utresa.customer);
    fd.append('datum', s.utresa.date);
    fd.append('subject', subject);
    fd.append('rapport', body);
    fd.append('payload', JSON.stringify(payload));
    req = fetch(BACKEND_URL, { method:'POST', body:fd })
      .then(r => r.json())
      .then(j => { if (!j || j.ok === false) throw new Error('server'); });
  } else {
    req = fetch(FORM_URL, { method:'POST', body:buildForm(subject, s, body), headers:{ 'Accept':'application/json' } })
      .then(r => { if (!r.ok) throw new Error('server'); });
  }
  req
    .then(() => {
      localStorage.removeItem(STORE_KEY);
      showOverlay('<div class="success-screen"><div class="success-icon">✓</div><div class="success-title">Rapport skickad!</div><div class="success-sub">Skickad till filmteamet@xft.se</div><button class="action-btn" onclick="newSession()">+ Nytt uppdrag</button></div>');
    })
    .catch(err => showSendError(err && err.message === 'server'
      ? 'Servern tog inte emot rapporten. Vänta en stund och försök igen — allt är kvar på den här enheten.'
      : 'Rapporten kom inte fram. Kontrollera internet och försök igen — allt är kvar på den här enheten.'));
}

function showSendError(msg) {
  showOverlay('<div class="success-screen"><div class="success-icon" style="border-color:var(--danger);background:var(--danger-dim);font-size:1.5rem;">!</div><div class="success-title" style="color:var(--danger);">Kunde inte skicka</div><div class="success-sub">' + msg + '</div><button class="action-btn" onclick="closeOverlay();submitKontor()">Försök igen</button><button class="action-btn-sec" onclick="closeOverlay()">Tillbaka</button></div>');
}

function newSession() { localStorage.removeItem(STORE_KEY); location.reload(); }

function askReset() {
  openConfirm(
    'Rensa allt och börja om?',
    'Hela det pågående uppdraget raderas från den här enheten och ingen rapport skickas. Detta går inte att ångra.',
    'Rensa allt', 'danger', newSession
  );
}

function selectAllUtresa() { const s = load(); if (s.utresa.locked) return; s.utresa.taken = EQUIPMENT.map(e => e.id); save(s); renderUtresa(); }

function lockUtresa() {
  const s = load();
  const filmer = document.getElementById('filmer-name').value.trim();
  const customer = document.getElementById('customer-name').value.trim();
  const date = document.getElementById('trip-date').value;
  if (!filmer) { toast('Fyll i ditt namn', true); return; }
  if (!customer) { toast('Fyll i kundnamn', true); return; }
  if (!date) { toast('Välj datum', true); return; }
  if (!s.utresa.taken.length) { toast('Välj minst en sak', true); return; }
  s.utresa.filmer = filmer;
  s.utresa.customer = customer;
  s.utresa.date = date;
  s.utresa.locked = true;
  // Uppdrags-ID knyter ihop utresan och slutrapporten i loggen
  if (!s.tripId) s.tripId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  // Rensa referenser till saker som inte längre är medtagna (efter upplåsning och ändring)
  s.hemresa.returned = s.hemresa.returned.filter(id => s.utresa.taken.includes(id));
  Object.keys(s.kontor.wear).forEach(id => { if (!s.utresa.taken.includes(parseInt(id))) delete s.kontor.wear[id]; });
  const bts = s.hemresa.bts || {};
  if (!bts.status && !s.btsShown) {
    s.btsShown = true;
    document.getElementById('bts-modal').classList.add('open');
  }
  save(s); render();
  reportUtresa(s);
}

function unlockUtresa() {
  const s = load();
  if (s.hemresa.locked) {
    openConfirm(
      'Lås upp utresan?',
      'Hemresans bekräftelse tas också bort. Det du redan har bockat i finns kvar, så du kan ändra och sedan låsa igen.',
      'Lås upp', 'accent', doUnlockUtresa
    );
  } else {
    doUnlockUtresa();
  }
}
function doUnlockUtresa() {
  const s = load();
  s.utresa.locked = false;
  s.hemresa.locked = false;
  save(s); render();
  toast('Utresan är upplåst — ändra och lås igen');
}

function unlockHemresa() {
  const s = load();
  s.hemresa.locked = false;
  save(s); render();
  toast('Hemresan är upplåst — ändra och bekräfta igen');
}

function selectAllHemresa() { const s = load(); if (s.hemresa.locked) return; s.hemresa.returned = s.utresa.taken.slice(); save(s); renderHemresa(); }

function lockHemresa() {
  const s = load();
  const bts = s.hemresa.bts || {};
  if (!bts.status) { toast('Besvara BTS-frågan först', true); return; }
  if (bts.status === 'nej') {
    const reasonEl = document.getElementById('bts-reason');
    const reason = reasonEl ? reasonEl.value.trim() : (bts.reason || '');
    if (!reason) { toast('Ange varför BTS inte filmades', true); return; }
    s.hemresa.bts.reason = reason;
    save(s);
  }
  const missing = missingItems(s);
  if (missing.length) {
    const list = '<ul class="modal-list">' + missing.map(e => '<li>' + esc(itemName(e)) + ' <span style="color:var(--muted)">(' + esc(groupDisplay(e.group)) + ')</span></li>').join('') + '</ul>';
    openConfirm(
      missing.length === 1 ? '1 sak är inte avbockad' : missing.length + ' saker är inte avbockade',
      'Följande är inte avbockat som returnerat och rapporteras som saknat. Har du något av detta med dig? Välj Avbryt och bocka av det först.' + list,
      missing.length === 1 ? 'Den saknas — bekräfta hemresan' : 'De saknas — bekräfta hemresan', 'danger', doLockHemresa
    );
    return;
  }
  doLockHemresa();
}
function doLockHemresa() {
  const s = load();
  s.hemresa.locked = true;
  save(s);
  toast('Hemresa bekräftad!');
  switchTab('kontor');
}

function toggleItem(id) { const s = load(); if (s.utresa.locked) return; const i = s.utresa.taken.indexOf(id); if (i === -1) s.utresa.taken.push(id); else s.utresa.taken.splice(i,1); save(s); renderUtresa(); }
function toggleGel(name) { const s = load(); if (s.utresa.locked) return; const i = s.gels.indexOf(name); if (i === -1) s.gels.push(name); else s.gels.splice(i,1); save(s); renderUtresa(); }
function toggleGroupAll(gname) { const s = load(); if (s.utresa.locked) return; const items = EQUIPMENT.filter(e => e.group === gname); const allC = items.every(e => s.utresa.taken.includes(e.id)); items.forEach(item => { if (allC) { s.utresa.taken = s.utresa.taken.filter(id => id !== item.id); } else { if (!s.utresa.taken.includes(item.id)) s.utresa.taken.push(item.id); } }); save(s); renderUtresa(); }
function toggleGroupOpen(gname) { const s = load(); s.openGroups[gname] = s.openGroups[gname] === false ? true : false; save(s); renderUtresa(); }
function toggleHemItem(id) { const s = load(); if (s.hemresa.locked) return; const i = s.hemresa.returned.indexOf(id); if (i === -1) s.hemresa.returned.push(id); else s.hemresa.returned.splice(i,1); save(s); renderHemresa(); }
function toggleHemGroupAll(gname) { const s = load(); if (s.hemresa.locked) return; const items = EQUIPMENT.filter(e => s.utresa.taken.includes(e.id) && e.group === gname); const allC = items.every(e => s.hemresa.returned.includes(e.id)); items.forEach(item => { if (allC) { s.hemresa.returned = s.hemresa.returned.filter(id => id !== item.id); } else { if (!s.hemresa.returned.includes(item.id)) s.hemresa.returned.push(item.id); } }); save(s); renderHemresa(); }
function toggleHemGroupOpen(gname) { const s = load(); s.openGroups['h_' + gname] = s.openGroups['h_' + gname] === false ? true : false; save(s); renderHemresa(); }
function setWear(id, status) { const s = load(); if (!s.kontor.wear[id]) s.kontor.wear[id] = { status:null, comment:'' }; s.kontor.wear[id].status = status; save(s); renderKontor(); }
function setWearComment(id, val) { const s = load(); if (!s.kontor.wear[id]) s.kontor.wear[id] = { status:null, comment:'' }; s.kontor.wear[id].comment = val; save(s); }

// Namn, kund och datum sparas löpande så att inget försvinner om sidan laddas om
function bindDraftFields() {
  [['filmer-name','filmer'], ['customer-name','customer'], ['trip-date','date']].forEach(function([id, key]) {
    const el = document.getElementById(id);
    const store = function() { const s = load(); if (s.utresa.locked) return; s.utresa[key] = el.value; save(s); };
    el.addEventListener('input', store);
    el.addEventListener('change', store);
  });
}

// ── START ──
// Pågående arbete får aldrig raderas vid sidladdning — allt återställs från localStorage,
// och appen öppnar på den flik där användaren är i flödet.
(function init() {
  bindDraftFields();
  const s = load();
  if (!s.utresa.date) document.getElementById('trip-date').valueAsDate = new Date();
  if (s.utresa.locked) {
    switchTab(s.hemresa.locked ? 'kontor' : 'hemresa');
  } else {
    render();
  }
  // Offlinestöd: cachar appen så att den startar även utan uppkoppling
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() { navigator.serviceWorker.register('./sw.js').catch(function() {}); });
  }
})();
</script>
